name: Hidden Beyond Kaggle Stop

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/kaggle-stop.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stop active Kaggle kernel by deleting it
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet --upgrade kaggle
          REF="$(jq -r '.kernel_ref' hidden_beyond/kaggle-stop.json)"
          test -n "$REF" && test "$REF" != "null"
          kaggle kernels delete "$REF" --yes
          echo "KAGGLE_KERNEL_STOPPED $REF"
