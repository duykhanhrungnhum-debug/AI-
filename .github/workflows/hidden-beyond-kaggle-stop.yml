name: Hidden Beyond Kaggle Stop

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/kaggle-stop.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stop active Kaggle kernel by deleting it
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet --upgrade kaggle
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import os
          from pathlib import Path
          token=os.environ["KAGGLE_API_TOKEN"].strip()
          if not token:
              raise SystemExit("KAGGLE_API_TOKEN is empty after stripping whitespace")
          p=Path.home()/".kaggle"/"access_token"
          p.write_text(token,encoding="utf-8")
          p.chmod(0o600)
          PY
          unset KAGGLE_API_TOKEN
          REF="$(jq -r '.kernel_ref' hidden_beyond/kaggle-stop.json)"
          test -n "$REF" && test "$REF" != "null"
          kaggle kernels delete "$REF" --yes
          echo "KAGGLE_KERNEL_STOPPED $REF"
