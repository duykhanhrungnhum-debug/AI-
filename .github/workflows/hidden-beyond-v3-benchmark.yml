name: Hidden Beyond V3 Benchmark

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/benchmark/request.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-v3-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      BENCH_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-benchmark-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coordinator
        run: |
          set -Eeuo pipefail
          python -m pip install -e .
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq
          test -n "$KAGGLE_API_TOKEN"
          jq . hidden_beyond/benchmark/request.json

      - name: Register benchmark callback
        shell: bash
        run: |
          set -Eeuo pipefail
          OIDC="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-v3-benchmark"             | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          SOURCE_VIDEO_ID="$(jq -r '.source_video_id' hidden_beyond/benchmark/request.json)"
          jq -n --arg source_video_id "$SOURCE_VIDEO_ID" '{source_video_id:$source_video_id}' > bench-start-body.json
          curl --fail-with-body -sS -X POST "$BENCH_API/start"             -H "Authorization: Bearer $OIDC"             -H "content-type: application/json"             --data-binary @bench-start-body.json > bench-start.json
          test "$(jq -r '.ok' bench-start.json)" = "true"
          jq -r '.run_id' bench-start.json > bench-run-id.txt
          echo "V3_BENCH_REGISTERED id=$(cat bench-run-id.txt)"

      - name: Submit full-episode GPU benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          req=json.loads(Path("hidden_beyond/benchmark/request.json").read_text(encoding="utf-8"))
          start=json.loads(Path("bench-start.json").read_text(encoding="utf-8"))
          req.update({
              "callback_base":start["callback_base"],
              "run_id":start["run_id"],
              "run_token":start["run_token"],
          })
          source=Path("hidden_beyond/benchmark_v3_worker.py").read_text(encoding="utf-8")
          marker="# __BENCH_CONFIG_INJECT__"
          if marker not in source:
              raise SystemExit("benchmark marker missing")
          source=source.replace(marker,"BENCH = "+repr(req),1)
          nonce=re.sub(r"[^a-z0-9]+","-",str(req["nonce"]).lower()).strip("-")[-32:]
          slug=f"hidden-beyond-v3-bench-{nonce}"
          title=f"HB V3 Bench {nonce[-24:]}"
          worker=KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
              submission_retry_attempts=3,
              submission_retry_delay_seconds=20,
          )
          s=worker.submit_script(
              slug=slug,
              title=title,
              source=source,
              enable_internet=True,
              enable_gpu=True,
              is_private=True,
          )
          Path("gpu-submission.json").write_text(
              json.dumps({"ref":s.ref,"version":s.version_number,"slug":slug},indent=2)+"\n",
              encoding="utf-8",
          )
          print("V3_BENCH_SUBMITTED",s.ref,s.version_number)
          PY
          cat gpu-submission.json

      - name: Wait for benchmark evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bench-output
          RUN_ID="$(cat bench-run-id.txt)"
          for i in $(seq 1 60); do
            OIDC="$(curl -fsSL               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-v3-benchmark"               | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            jq -n --arg run_id "$RUN_ID" '{run_id:$run_id}' > bench-status-body.json
            curl --fail-with-body -sS -X POST "$BENCH_API/status"               -H "Authorization: Bearer $OIDC"               -H "content-type: application/json"               --data-binary @bench-status-body.json > bench-status.json
            STATE="$(jq -r '.run.state' bench-status.json)"
            STAGE="$(jq -r '.run.stage' bench-status.json)"
            MSG="$(jq -r '.run.message // ""' bench-status.json)"
            echo "V3_BENCH_PROGRESS poll=$i state=$STATE stage=$STAGE message=$MSG"
            if [ "$STATE" = "completed" ]; then
              jq '.run.benchmark_report' bench-status.json > bench-output/benchmark.json
              jq '.run.translated_metadata' bench-status.json > bench-output/translated-metadata.json
              test -s bench-output/benchmark.json
              test -s bench-output/translated-metadata.json
              jq . bench-output/benchmark.json
              exit 0
            fi
            if [ "$STATE" = "failed" ]; then
              echo "::error title=V3 benchmark worker failed::$MSG"
              exit 1
            fi
            sleep 20
          done
          echo "::error title=V3 benchmark timeout::No completion callback within 20 minutes."
          exit 1

      - name: Measure CPU TTS
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet "piper-tts>=1.3,<2" numpy
          python scripts/render_hidden_beyond_voice_cpu.py \
            --metadata bench-output/translated-metadata.json \
            --output bench-output/voice.mp3
          test -s bench-output/voice.mp3
          jq '{
            translation_model,
            transcript_source,
            gpu_translation_seconds,
            voice_render_seconds,
            retimed_segments,
            timing_overflow_segments,
            voice_efficiency_mode
          }' bench-output/translated-metadata.json

      - name: Verify performance and reference-quality target
        shell: bash
        run: |
          set -Eeuo pipefail
          TRANSLATE="$(jq -r '.translation_seconds' bench-output/benchmark.json)"
          INVALID="$(jq -r '.invalid_segments' bench-output/benchmark.json)"
          TTS="$(jq -r '.voice_render_seconds' bench-output/translated-metadata.json)"
          DENSITY="$(jq -r '.segments_per_minute' bench-output/benchmark.json)"
          MAX_SEG="$(jq -r '.max_segment_seconds' bench-output/benchmark.json)"
          SEGMENTS="$(jq -r '.segments' bench-output/benchmark.json)"
          HARD_TRIM="$(jq -r '.hard_trim_segments // 0' bench-output/translated-metadata.json)"
          python - "$TRANSLATE" "$INVALID" "$TTS" "$DENSITY" "$MAX_SEG" "$SEGMENTS" "$HARD_TRIM" <<'PY'
          import sys, math
          trans=float(sys.argv[1]); invalid=int(sys.argv[2]); tts=float(sys.argv[3])
          density=float(sys.argv[4]); max_seg=float(sys.argv[5]); segments=int(sys.argv[6]); hard_trim=int(sys.argv[7])
          trim_limit=max(3, math.ceil(segments*0.01))
          print(
              f"V3_QUALITY translation={trans:.1f}s tts={tts:.1f}s invalid={invalid} "
              f"density={density:.2f}/min max_seg={max_seg:.2f}s hard_trim={hard_trim}/{segments}"
          )
          if trans>300:
              raise SystemExit(f"Translation target missed: {trans:.1f}s > 300s")
          if invalid>0:
              raise SystemExit(f"Primary translation quality gate missed: invalid={invalid}")
          if density<3.0:
              raise SystemExit(f"Dialogue cadence too coarse: {density:.2f} segments/min")
          if max_seg>6.2:
              raise SystemExit(f"Dialogue cue too long: {max_seg:.2f}s")
          if hard_trim>trim_limit:
              raise SystemExit(f"Too many TTS hard trims: {hard_trim}>{trim_limit}")
          if trans+tts>900:
              raise SystemExit(f"Translation+TTS target missed: {trans+tts:.1f}s > 900s")
          print("V3_REFERENCE_QUALITY_TARGET_VERIFIED")
          PY

      - name: Report benchmark workflow failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ ! -s bench-start.json ]; then exit 0; fi
          RUN_ID="$(jq -r '.run_id // empty' bench-start.json)"
          RUN_TOKEN="$(jq -r '.run_token // empty' bench-start.json)"
          [ -n "$RUN_ID" ] && [ -n "$RUN_TOKEN" ] || exit 0
          jq -n --arg run_id "$RUN_ID" --arg error "GitHub benchmark orchestrator failed before verified completion"             '{run_id:$run_id,error:$error}' > bench-fail.json
          curl -sS -X POST "$BENCH_API/fail"             -H "x-benchmark-token: $RUN_TOKEN"             -H "content-type: application/json"             --data-binary @bench-fail.json >/dev/null || true
          echo "V3_BENCH_FAILURE_REPORTED id=$RUN_ID"

      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-v3-benchmark-evidence
          path: |
            gpu-submission.json
            bench-run-id.txt
            bench-output/benchmark.json
            bench-output/translated-metadata.json
            bench-output/voice.mp3
          if-no-files-found: warn
          retention-days: 7
