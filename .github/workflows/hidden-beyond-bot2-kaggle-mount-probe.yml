name: Hidden Beyond Bot2 Kaggle Mount Probe

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/bot2_kaggle_mount_probe.trigger"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Submit CPU mount probe
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python - <<'PY'
          import os,textwrap
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          source=textwrap.dedent(r"""
          import json,urllib.request
          from pathlib import Path

          PROBE_ID="44268abd-b920-4349-9b29-8e1dd47f65db"
          CALLBACK="https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hb-bot2-kaggle-source-probe"

          files=[]
          for p in Path("/kaggle/input").rglob("*"):
              if p.is_file():
                  try: size=p.stat().st_size
                  except Exception: size=-1
                  files.append({"path":str(p),"size":size})
          matches=[x for x in files if x["path"].endswith("source-smoke.mp4")]
          result={
              "probe_id":PROBE_ID,
              "kind":"mount",
              "ok":bool(matches),
              "matches":matches[:5],
              "input_file_count":len(files),
              "sample_files":files[:25],
          }
          req=urllib.request.Request(
              CALLBACK,
              data=json.dumps(result,ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={"content-type":"application/json"},
          )
          with urllib.request.urlopen(req,timeout=60) as r:
              print("CALLBACK",r.status,r.read().decode("utf-8","replace"))
          print("BOT2_MOUNT_PROBE",json.dumps(result,ensure_ascii=False))
          """)

          w=KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
          )
          s=w.submit_script(
              slug="hidden-beyond-bot2-source-mount-probe",
              title="Hidden Beyond Bot2 Source Mount Probe",
              source=source,
              kernel_sources=["duykhanhta/hidden-beyond-bot2-source-pot-probe"],
              enable_internet=True,
              enable_gpu=False,
              is_private=True,
          )
          print("BOT2_MOUNT_PROBE_SUBMITTED",s.ref,s.version_number)
          PY
