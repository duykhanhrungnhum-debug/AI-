name: Hy-MT2 Router CI

on:
  pull_request:
    paths:
      - "hidden_beyond/longform_audio_worker_v3.py"
      - "tests/test_hidden_beyond_translation_repair.py"
      - ".github/workflows/hymt2-router-ci.yml"
  workflow_dispatch:

jobs:
  cpu-router-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile worker
        run: python -m py_compile hidden_beyond/longform_audio_worker_v3.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused translation router tests
        run: pytest -q tests/test_hidden_beyond_translation_repair.py
