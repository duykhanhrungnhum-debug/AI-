name: AIKA Warm Image Canary

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    if: startsWith(github.event.issue.title, '[AIKA-WARM-CANARY]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIKA_CANARY_URL: https://aika-chat-canary-production.up.railway.app
      AIKA_CANARY_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Require canary credential
        run: test -n "$AIKA_CANARY_TOKEN"

      - name: Run real warm-worker reuse and batch test
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ["AIKA_CANARY_URL"].rstrip("/")
          token = os.environ["AIKA_CANARY_TOKEN"]
          out = Path("warm-canary-output")
          out.mkdir(exist_ok=True)

          def req(method, path, payload=None, *, timeout=120):
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "AIKA-Warm-Canary/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  raw = response.read()
                  ctype = response.headers.get("content-type", "")
                  if "application/json" in ctype:
                      return json.loads(raw.decode("utf-8")) if raw else None
                  return raw

          def wait_health():
              last = ""
              for _ in range(60):
                  try:
                      request = urllib.request.Request(base + "/health", headers={"User-Agent": "AIKA-Warm-Canary/1.0"})
                      with urllib.request.urlopen(request, timeout=10) as response:
                          if response.status == 200:
                              return
                  except Exception as exc:
                      last = f"{type(exc).__name__}: {exc}"
                  time.sleep(2)
              raise RuntimeError("canary health did not become ready: " + last)

          def run_image(label, message):
              started_wall = time.perf_counter()
              created = req("POST", "/v1/chat", {"message": message, "prompt": message})
              job_id = str(created.get("job_id") or "")
              if not job_id:
                  raise RuntimeError(label + " did not return job_id")
              final = None
              for _ in range(220):
                  time.sleep(3)
                  final = req("GET", "/v1/chat/status?job_id=" + urllib.parse.quote(job_id))
                  if final.get("status") == "done":
                      break
                  if final.get("status") == "error":
                      raise RuntimeError(label + " failed: " + str(final.get("error") or final.get("worker_error")))
              if not final or final.get("status") != "done":
                  raise TimeoutError(label + " did not complete")
              wall = round(time.perf_counter() - started_wall, 3)
              urls = final.get("image_urls") or ([final.get("image_url")] if final.get("image_url") else [])
              for index, url in enumerate(urls):
                  image = req("GET", str(url), timeout=120)
                  if not isinstance(image, bytes) or not image.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise RuntimeError(label + " returned non-PNG image")
                  (out / f"{label}-{index + 1}.png").write_bytes(image)
              return {
                  "job_id": job_id,
                  "wall_seconds": wall,
                  "provider": final.get("provider"),
                  "model": final.get("model"),
                  "image_count": final.get("image_count"),
                  "generation_seconds": final.get("elapsed_seconds"),
                  "warm_image_enabled": final.get("warm_image_enabled"),
                  "worker_state": final.get("worker_state"),
                  "generation_prompts": final.get("generation_prompts"),
              }

          wait_health()
          first = run_image("first", "AIKA tạo một ảnh chân thực quả táo đỏ trên bàn gỗ, nền sạch.")
          second = run_image("second", "AIKA tạo một ảnh chân thực quả cam tươi trên bàn gỗ, nền sạch.")
          batch = run_image(
              "batch",
              "AIKA tạo hai ảnh riêng biệt để kiểm tra: ảnh thứ nhất là một bông sen hồng chân thực trên mặt nước; ảnh thứ hai là một bông hướng dương chân thực ngoài đồng. Đây là hai file ảnh riêng, không ghép chung.",
          )

          for name, result in (("first", first), ("second", second), ("batch", batch)):
              if result["provider"] != "kaggle-image-warm":
                  raise RuntimeError(f"{name} did not use warm provider: {result['provider']}")
              if result["warm_image_enabled"] is not True:
                  raise RuntimeError(f"{name} warm flag was not enabled")
          if int(first.get("image_count") or 0) != 1 or int(second.get("image_count") or 0) != 1:
              raise RuntimeError("single-image warm jobs did not return exactly one image")
          if int(batch.get("image_count") or 0) != 2:
              raise RuntimeError(f"batch expected 2 separate images, got {batch.get('image_count')}")
          # The second request must be a warm reuse. Keep a generous ceiling to
          # avoid false failures from network jitter while still detecting a full
          # 3-5 minute cold-start cycle.
          if float(second["wall_seconds"]) >= 150:
              raise RuntimeError(f"second warm job took too long: {second['wall_seconds']}s")

          report = {"first": first, "second": second, "batch": batch}
          (out / "report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("AIKA_WARM_CANARY_SUCCESS")
          print(json.dumps({
              "first_wall_seconds": first["wall_seconds"],
              "second_wall_seconds": second["wall_seconds"],
              "batch_wall_seconds": batch["wall_seconds"],
              "batch_image_count": batch["image_count"],
              "provider": batch["provider"],
          }, ensure_ascii=False))
          PY

      - name: Upload canary evidence
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: aika-warm-image-canary-${{ github.event.issue.number }}
          path: warm-canary-output/
          if-no-files-found: warn
          retention-days: 3

      - name: Report canary result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "AIKA_WARM_CANARY_SUCCESS\n\nArtifact: $ARTIFACT_URL"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "AIKA_WARM_CANARY_FAILED. Xem workflow run để lấy lỗi cụ thể."
          fi
