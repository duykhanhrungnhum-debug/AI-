name: AIKA Two Outfits Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aika-two-outfits-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  test-ao-dai-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AIKA
        run: python -m pip install -e .
      - name: Require Kaggle credential
        run: test -n "$KAGGLE_API_TOKEN"
      - name: Ask AIKA to regenerate only the Vietnamese ao dai image
        run: |
          python - <<'PY'
          import json, os
          from hashlib import sha256
          from pathlib import Path
          from ai_agent.chat_session import classify_chat_intent
          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          from ai_agent.core.media_v2 import ImageRequestV2, KaggleImageV2Provider

          command = "AIKA tạo một tấm ảnh riêng biệt: một cô gái châu Á trẻ trung xinh đẹp, trưởng thành, mặc áo dài truyền thống Việt Nam thanh lịch. Chỉ một cô gái trong ảnh, không ghép ảnh, phong cách ảnh chân thực, toàn thân, khuôn mặt tự nhiên, trang phục rõ ràng."
          assert classify_chat_intent(command) == "image"
          provider = KaggleImageV2Provider(
              worker=KaggleGpuWorker(
                  api_token=os.environ["KAGGLE_API_TOKEN"],
                  username=os.environ["KAGGLE_USERNAME"],
                  timeout=120,
                  submission_retry_attempts=5,
                  submission_retry_delay_seconds=30,
              ),
              kernel_slug="ai-agent-image-v2",
              poll_interval=3,
              max_poll_attempts=600,
          )
          seed = int.from_bytes(sha256(command.encode("utf-8")).digest()[:4], "big")
          result = provider.generate_many((ImageRequestV2(
              item_id="ao_dai_vietnam_fixed",
              command=command,
              seed=seed,
              width=1024,
              height=1024,
          ),))[0]
          out = Path("aika-ao-dai-fix")
          out.mkdir(exist_ok=True)
          (out / "ao_dai_vietnam.png").write_bytes(result.data)
          report = {
              "model": result.model,
              "elapsed_seconds": result.elapsed_seconds,
              "generation_prompt": result.prompt,
              "evidence": list(result.evidence),
          }
          (out / "report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          folded = result.prompt.casefold()
          if "hanbok" in folded:
              raise RuntimeError("AIKA recaption still substituted áo dài with hanbok")
          if "áo dài" not in folded and "ao dai" not in folded:
              raise RuntimeError("AIKA recaption did not preserve áo dài")
          required = ("side slit", "trouser")
          if not all(token in folded for token in required):
              raise RuntimeError("AIKA recaption did not describe canonical áo dài structure")
          print("AIKA_AO_DAI_FIXED_OK", result.model, result.elapsed_seconds, flush=True)
          print("RECAPTION", result.prompt, flush=True)
          PY
      - name: Upload corrected AIKA ao dai image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aika-ao-dai-fix
          path: aika-ao-dai-fix/
          if-no-files-found: warn
          retention-days: 3
