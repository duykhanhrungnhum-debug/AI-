name: Premium Vision Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/premium-vision-review.trigger"

permissions:
  contents: read
  actions: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install package
        run: python -m pip install -e .

      - name: Download existing human and mascot candidates
        run: |
          mkdir -p review-input/human review-input/mascot review-output
          gh run download 36518756508 -n premium-human-command-output -D review-input/human
          gh run download 36518758659 -n kaggle-image-smoke-output -D review-input/mascot
          find review-input -maxdepth 3 -type f -print

      - name: Review existing candidates with Qwen3-VL
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          from ai_agent.core.media_command import HUMAN_PHOTO_PREMIUM, MASCOT_PREMIUM, benchmark_manifest
          from ai_agent.core.vision_quality import KaggleVisionQualityVerifier, VisionQualityRequest

          human_candidates = [
              Path("review-input/human/candidate.png"),
              Path("review-input/human/image.png"),
          ]
          human_path = next((path for path in human_candidates if path.exists()), None)
          mascot_path = Path("review-input/mascot/generated.png")
          if human_path is None:
              raise FileNotFoundError("human candidate artifact does not contain candidate.png or image.png")
          if not mascot_path.exists():
              raise FileNotFoundError("mascot candidate artifact does not contain generated.png")

          manifest = benchmark_manifest()
          human_rubric = tuple(manifest["profiles"][HUMAN_PHOTO_PREMIUM.name]["must_pass"])
          mascot_rubric = tuple(manifest["profiles"][MASCOT_PREMIUM.name]["must_pass"])

          requests = (
              VisionQualityRequest(
                  item_id="human-current-candidate",
                  image=human_path.read_bytes(),
                  prompt=(
                      "one young Asian woman jogging outdoors on a modern glass bridge in morning light, "
                      "black and teal sportswear, holding a water bottle, happy natural face, full body head to toe, "
                      "premium photorealistic commercial fitness photograph"
                  ),
                  profile=HUMAN_PHOTO_PREMIUM.name,
                  rubric=human_rubric,
                  expected_subject_count=1,
              ),
              VisionQualityRequest(
                  item_id="mascot-current-candidate",
                  image=mascot_path.read_bytes(),
                  prompt=(
                      "exactly one premium polished cute red-orange 3D crab mascot on one green lily pad, "
                      "two coherent claws, coherent crab legs, expressive glossy eyes, friendly smile, "
                      "clean rounded shell, water droplets, crisp cutout-ready silhouette, studio-quality materials and lighting"
                  ),
                  profile=MASCOT_PREMIUM.name,
                  rubric=mascot_rubric,
                  expected_subject_count=1,
              ),
          )

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          result = KaggleVisionQualityVerifier(
              worker=worker,
              kernel_slug="ai-agent-qwen3-premium-review",
              poll_interval=15,
              max_poll_attempts=120,
              min_quality_score=8.0,
              min_prompt_match_score=8.0,
          ).verify_many(requests)

          payload = {
              "model": "Qwen/Qwen3-VL-8B-Instruct",
              "passed": result.passed,
              "items": [
                  {
                      "item_id": item.item_id,
                      "passed": item.passed,
                      "quality_score": item.quality_score,
                      "prompt_match_score": item.prompt_match_score,
                      "structure_score": item.structure_score,
                      "detail_score": item.detail_score,
                      "aesthetic_score": item.aesthetic_score,
                      "composition_score": item.composition_score,
                      "benchmark_match_score": item.benchmark_match_score,
                      "subject_count": item.subject_count,
                      "major_issues": list(item.major_issues),
                      "minor_issues": list(item.minor_issues),
                      "review_text": item.review_text,
                      "evidence": list(item.evidence),
                  }
                  for item in result.items
              ],
          }
          Path("review-output/vision-review.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          if not result.passed:
              raise RuntimeError(
                  "Qwen3 premium review rejected: " + ", ".join(result.failed_item_ids)
              )
          PY

      - name: Upload Qwen3 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-premium-vision-review
          path: review-output/
          if-no-files-found: warn
          retention-days: 7
