name: LTX Video Only Real Smoke

on:
  push:
    branches:
      - money-agent-flux-ltx-smoke
    paths:
      - .github/workflows/ltx-video-only-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: money-agent-flux-ltx-smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated LTX video test
        run: python tmp/run_ltx_video_only.py
      - name: Upload video result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx-video-only-result
          path: video-smoke-results/
          if-no-files-found: warn
          retention-days: 7
