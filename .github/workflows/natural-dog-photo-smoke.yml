name: Natural Dog Photo Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/natural-dog-photo-smoke.yml"
      - ".github/natural-dog-photo-smoke.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  natural-dog-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      MEDIA_OUTPUT_DIR: natural-dog-photo
      MEDIA_CLIP_PRECHECK: "0"
      MEDIA_COMMANDS_JSON: >-
        [{"id":"real","command":"Tạo ảnh đúng một chú chó Golden Retriever thật đang đi tự nhiên trên bãi cỏ ngoài trời, ảnh chụp đời thường chân thực bằng máy ảnh, ánh sáng tự nhiên, toàn thân, giải phẫu chính xác, lông có độ không hoàn hảo tự nhiên, màu sắc và tương phản vừa phải, không chỉnh HDR, không retouch quảng cáo, không làm nét quá mức."}]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install package
        run: python -m pip install -e .

      - name: Generate natural dog photo
        shell: bash
        run: |
          set +e
          START=$(date +%s)
          python scripts/generate_premium_image_batch.py
          EXIT=$?
          END=$(date +%s)
          python - <<PY
          import json
          from pathlib import Path
          Path("natural-dog-photo/elapsed.json").write_text(
              json.dumps({"elapsed_seconds": int("$END") - int("$START")}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          exit "$EXIT"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-dog-photo-output
          path: natural-dog-photo/
          if-no-files-found: error
          retention-days: 7
