name: Hidden Beyond Translation Skill

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/translation-skill/request.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-translation-skill
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      BENCH_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-benchmark-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coordinator
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e .
          test -n "$KAGGLE_API_TOKEN"
          jq . hidden_beyond/translation-skill/request.json

      - name: Register translation benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-v3-benchmark" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          SOURCE_VIDEO_ID="$(jq -r '.source_video_id' hidden_beyond/translation-skill/request.json)"
          jq -n --arg source_video_id "$SOURCE_VIDEO_ID" '{source_video_id:$source_video_id}' > bench-start-body.json
          curl --fail-with-body -sS -X POST "$BENCH_API/start" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @bench-start-body.json > bench-start.json
          test "$(jq -r '.ok' bench-start.json)" = "true"
          jq -r '.run_id' bench-start.json > bench-run-id.txt

      - name: Run focused translation skill benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/submit_hidden_beyond_translation_skill.py
