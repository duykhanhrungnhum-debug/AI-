name: Hidden Beyond Translation Skill

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/translation-skill/request.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-translation-skill
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      BENCH_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-benchmark-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coordinator
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e .
          test -n "$KAGGLE_API_TOKEN"
          jq . hidden_beyond/translation-skill/request.json

      - name: Register translation benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-v3-benchmark" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          SOURCE_VIDEO_ID="$(jq -r '.source_video_id' hidden_beyond/translation-skill/request.json)"
          jq -n --arg source_video_id "$SOURCE_VIDEO_ID" '{source_video_id:$source_video_id}' > bench-start-body.json
          curl --fail-with-body -sS -X POST "$BENCH_API/start" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @bench-start-body.json > bench-start.json
          test "$(jq -r '.ok' bench-start.json)" = "true"
          jq -r '.run_id' bench-start.json > bench-run-id.txt

      - name: Run focused translation skill benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/submit_hidden_beyond_translation_skill.py

      - name: Wait for verified translation result
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID="$(cat bench-run-id.txt)"
          for i in $(seq 1 60); do
            OIDC="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-v3-benchmark" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            jq -n --arg run_id "$RUN_ID" '{run_id:$run_id}' > bench-status-body.json
            curl --fail-with-body -sS -X POST "$BENCH_API/status" -H "Authorization: Bearer $OIDC" -H "content-type: application/json" --data-binary @bench-status-body.json > bench-status.json
            STATE="$(jq -r '.run.state' bench-status.json)"
            STAGE="$(jq -r '.run.stage' bench-status.json)"
            MSG="$(jq -r '.run.message // ""' bench-status.json)"
            echo "TRANSLATION_SKILL_PROGRESS poll=$i state=$STATE stage=$STAGE message=$MSG"
            if [ "$STATE" = "completed" ]; then
              jq '.run.benchmark_report' bench-status.json > translation-report.json
              test "$(jq -r '.ok' translation-report.json)" = "true"
              test "$(jq -r '.failed' translation-report.json)" = "0"
              jq . translation-report.json
              echo "TRANSLATION_SKILL_VERIFIED"
              exit 0
            fi
            if [ "$STATE" = "failed" ]; then
              echo "::error title=Translation skill benchmark failed::$MSG"
              exit 1
            fi
            sleep 20
          done
          echo "::error title=Translation skill benchmark timeout::No callback within 20 minutes."
          exit 1
