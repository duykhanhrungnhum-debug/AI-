name: AI Complete Video On Demand

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Verified script to turn into a complete video"
        required: true
        type: string
      visual_style:
        description: "Visual direction for every scene"
        required: false
        default: "photorealistic cinematic Vietnamese short film, natural acting, consistent characters"
        type: string
      max_scenes:
        description: "Maximum number of generated motion scenes"
        required: false
        default: "7"
        type: string
      composition:
        description: "Scene composition, e.g. 9:16 vertical or 16:9 widescreen"
        required: false
        default: "9:16 vertical"
        type: string

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      VIDEO_SCRIPT: ${{ inputs.script }}
      VIDEO_VISUAL_STYLE: ${{ inputs.visual_style }}
      VIDEO_MAX_SCENES: ${{ inputs.max_scenes }}
      VIDEO_COMPOSITION: ${{ inputs.composition }}
      VIDEO_OUTPUT_DIR: ai-video-output
      VIDEO_CLIP_WIDTH: "480"
      VIDEO_CLIP_HEIGHT: "832"
      VIDEO_CLIP_FRAMES: "33"
      VIDEO_CLIP_FPS: "16"
      VIDEO_INFERENCE_STEPS: "10"
      VIDEO_FINAL_WIDTH: "720"
      VIDEO_FINAL_HEIGHT: "1280"
      PIPER_VOICE: vi_VN-vais1000-medium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        shell: bash
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install AI package, Piper, and FFmpeg
        shell: bash
        run: |
          python -m pip install -e .
          python -m pip install "piper-tts>=1.3,<2"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Vietnamese Piper voice
        shell: bash
        run: |
          mkdir -p piper-voices
          python -m piper.download_voices "$PIPER_VOICE" --download-dir piper-voices
          test -s "piper-voices/$PIPER_VOICE.onnx"
          test -s "piper-voices/$PIPER_VOICE.onnx.json"

      - name: Preflight compile
        run: >-
          python -m py_compile
          src/ai_agent/core/kaggle_video.py
          src/ai_agent/core/generative_video_pipeline.py
          scripts/generate_ai_video.py

      - name: Generate complete video
        run: python scripts/generate_ai_video.py

      - name: Upload final video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-complete-video-output
          path: ai-video-output/
          if-no-files-found: warn
          retention-days: 7
