name: Wan Diffusers RealESRGAN 1080p Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - money-agent-flux-ltx-smoke
    paths:
      - .github/wan-gpu-test.trigger

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: money-agent-flux-ltx-smoke

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run exact Money Agent Wan + Real-ESRGAN code
        run: python tmp/run_wan_realesrgan_smoke.py

      - name: Upload Wan Real-ESRGAN result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-realesrgan-1080p-result
          path: wan-realesrgan-results/
          if-no-files-found: warn
          retention-days: 7

# rerun after NumPy ABI fix

# final hardened runtime smoke
