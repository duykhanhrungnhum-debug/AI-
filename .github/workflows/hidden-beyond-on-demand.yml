name: Hidden Beyond On-Demand AI Worker

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/requests/active.json"
  workflow_dispatch:
    inputs:
      request_artifact_run_id:
        description: "Bot workflow run containing hidden-beyond-ai-request artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  process-request:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.HIDDEN_BEYOND_GITHUB_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      PIPER_VOICE: vi_VN-vais1000-medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Restore Piper voice cache
        id: piper-cache
        uses: actions/cache/restore@v4
        with:
          path: piper-voices
          key: piper-${{ runner.os }}-${{ env.PIPER_VOICE }}-v1
      - name: Require runtime credentials
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$GH_TOKEN" || { echo "HIDDEN_BEYOND_GITHUB_TOKEN missing"; exit 1; }
          fi
      - name: Load Bot request
        run: |
          mkdir -p request result
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            cp hidden_beyond/requests/active.json request/request.json
          else
            gh run download "${{ inputs.request_artifact_run_id }}" --repo duykhanhrungnhum-debug/mystery-video --name hidden-beyond-ai-request --dir request
          fi
          test -s request/request.json
      - name: Install AI runtime
        run: |
          python -m pip install -e .
          python -m pip install "piper-tts>=1.3,<2"
          mkdir -p piper-voices
          if [ ! -s "piper-voices/$PIPER_VOICE.onnx" ] || [ ! -s "piper-voices/$PIPER_VOICE.onnx.json" ]; then
            for attempt in 1 2 3 4; do
              python -m piper.download_voices "$PIPER_VOICE" --download-dir piper-voices && break
              if [ "$attempt" = "4" ]; then
                echo "Piper voice download failed after bounded retries."
                exit 1
              fi
              sleep $((attempt * 8))
            done
          else
            echo "Piper voice restored from cache."
          fi
      - name: Save Piper voice cache
        if: ${{ steps.piper-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: piper-voices
          key: piper-${{ runner.os }}-${{ env.PIPER_VOICE }}-v1
      - name: Translate and synthesize on demand
        run: |
          python hidden_beyond/process_request.py
      - name: Upload AI result
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-ai-result
          path: result/
          if-no-files-found: error
          retention-days: 1
      - name: Handoff result
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "AI result artifact ready for external coordinator from run $GITHUB_RUN_ID"
          else
            gh workflow run resume-ai-video.yml --repo duykhanhrungnhum-debug/mystery-video -f ai_run_id="$GITHUB_RUN_ID" -f request_run_id="${{ inputs.request_artifact_run_id }}"
            echo "Bot resume dispatched from AI run $GITHUB_RUN_ID"
          fi
