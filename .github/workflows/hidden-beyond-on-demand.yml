name: Hidden Beyond On-Demand AI Worker

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/requests/active.json"
  workflow_dispatch:
    inputs:
      request_artifact_run_id:
        description: "Bot workflow run containing hidden-beyond-ai-request artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hidden-beyond-ai-worker
  cancel-in-progress: false

jobs:
  process-request:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.HIDDEN_BEYOND_GITHUB_TOKEN }}
      ZEROTTS_VOICE: hamy
      ZEROTTS_MODEL_DIR: ${{ github.workspace }}/zerotts-model
      ZEROTTS_CFG_SCALE: "1.0"
      ZEROTTS_AUDIO_TEMPERATURE: "0.78"
      ZEROTTS_AUDIO_TOPK: "25"
      ZEROTTS_AUDIO_TOPP: "0.95"
      ZEROTTS_AUDIO_REPETITION_PENALTY: "1.2"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Require only cross-repo credential when needed
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$GH_TOKEN" || { echo "HIDDEN_BEYOND_GITHUB_TOKEN missing"; exit 1; }
          fi

      - name: Load Bot request
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p request result
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            cp hidden_beyond/requests/active.json request/request.json
          else
            gh run download "${{ inputs.request_artifact_run_id }}" --repo duykhanhrungnhum-debug/mystery-video --name hidden-beyond-ai-request --dir request
          fi
          test -s request/request.json
          MODEL="$(python - <<'PY'
          import json
          d=json.load(open("request/request.json",encoding="utf-8"))
          lang=str(d.get("detected_language","en")).lower()
          print("Helsinki-NLP/opus-mt-zh-vi" if lang.startswith(("zh","cmn","yue")) else "VietAI/envit5-translation")
          PY
          )"
          echo "MARIAN_MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "MARIAN_CACHE_KEY=hf-${MODEL//\//-}-v1" >> "$GITHUB_ENV"

      - name: Restore ZeroTTS model cache
        id: zerotts-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ZEROTTS_MODEL_DIR }}
          key: zerotts-${{ runner.os }}-mit-v1

      - name: Restore Marian model cache
        id: marian-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ env.MARIAN_CACHE_KEY }}

      - name: Install AI runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e .
          python -m pip install "zerotts>=0.1.5,<0.2"
          python -c "import torch" 2>/dev/null || python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
          python -m pip install "transformers<5" sentencepiece sacremoses huggingface_hub
          if [ ! -s "$ZEROTTS_MODEL_DIR/config.json" ]; then
            python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path=snapshot_download(
              repo_id="zeroweight-ai/ZeroTTS",
              local_dir=os.environ["ZEROTTS_MODEL_DIR"],
          )
          print("ZEROTTS_MODEL_CACHED", path)
          PY
          else
            echo "ZeroTTS model restored from cache."
          fi

      - name: Prefetch Marian model
        if: ${{ steps.marian-cache.outputs.cache-hit != 'true' }}
        run: |
          python - <<'PY'
          import os
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer
          model=os.environ["MARIAN_MODEL"]
          AutoTokenizer.from_pretrained(model)
          AutoModelForSeq2SeqLM.from_pretrained(model)
          print("MARIAN_MODEL_CACHED", model)
          PY

      - name: Save ZeroTTS model cache
        if: ${{ steps.zerotts-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ZEROTTS_MODEL_DIR }}
          key: zerotts-${{ runner.os }}-mit-v1

      - name: Save Marian model cache
        if: ${{ steps.marian-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HF_HOME }}
          key: ${{ env.MARIAN_CACHE_KEY }}

      - name: Translate and synthesize on demand
        run: |
          python hidden_beyond/process_request.py

      - name: Upload AI result
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-ai-result
          path: result/
          if-no-files-found: error
          retention-days: 1

      - name: Handoff result
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "AI result artifact ready for external coordinator from run $GITHUB_RUN_ID"
          else
            gh workflow run resume-ai-video.yml --repo duykhanhrungnhum-debug/mystery-video -f ai_run_id="$GITHUB_RUN_ID" -f request_run_id="${{ inputs.request_artifact_run_id }}"
            echo "Bot resume dispatched from AI run $GITHUB_RUN_ID"
          fi
