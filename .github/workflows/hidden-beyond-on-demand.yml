name: Hidden Beyond On-Demand AI Worker

on:
  workflow_dispatch:
    inputs:
      request_artifact_run_id:
        description: "Bot workflow run containing hidden-beyond-ai-request artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  process-request:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.HIDDEN_BEYOND_GITHUB_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      PIPER_VOICE: vi_VN-vais1000-medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require runtime credentials
        run: |
          test -n "$GH_TOKEN" || { echo "HIDDEN_BEYOND_GITHUB_TOKEN missing"; exit 1; }
          test -n "$KAGGLE_API_TOKEN" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }
      - name: Download Bot request
        run: |
          mkdir -p request result
          gh run download "${{ inputs.request_artifact_run_id }}" --repo duykhanhrungnhum-debug/mystery-video --name hidden-beyond-ai-request --dir request
          test -s request/request.json
      - name: Install AI runtime
        run: |
          python -m pip install -e .
          python -m pip install "piper-tts>=1.3,<2"
          mkdir -p piper-voices
          python -m piper.download_voices "$PIPER_VOICE" --download-dir piper-voices
      - name: Translate and synthesize on demand
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ai_agent.core.kaggle_model import KaggleModelProvider
          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          from ai_agent.core.tts_model import PiperTTSProvider
          req=json.loads(Path("request/request.json").read_text(encoding="utf-8"))
          segments=req["segments"]
          prompts=[f"Translate this dialogue into natural Vietnamese suitable for dubbing. Preserve meaning and names. Return only Vietnamese text:\n{x['text']}" for x in segments]
          worker=KaggleGpuWorker(api_token=os.environ["KAGGLE_API_TOKEN"],username=os.environ["KAGGLE_USERNAME"])
          llm=KaggleModelProvider(worker=worker,model="Qwen/Qwen2.5-3B-Instruct",kernel_slug="hidden-beyond-on-demand",poll_interval=15,max_poll_attempts=180,max_new_tokens=256,temperature=0.0)
          batch=llm.generate_many(prompts)
          voice=PiperTTSProvider(model_path=f"piper-voices/{os.environ['PIPER_VOICE']}.onnx",binary="piper",timeout=300,min_duration_seconds=0.05)
          out=[]
          for src,res in zip(segments,batch.responses,strict=True):
              audio=voice.synthesize(res.text)
              name=f"segment-{int(src['index']):05d}.wav"
              Path("result",name).write_bytes(audio.data)
              out.append({"index":src["index"],"start":src["start"],"end":src["end"],"translation":res.text,"audio_file":name,"audio_evidence":audio.evidence})
          title_prompt="Translate this video title naturally to Vietnamese. Return only the Vietnamese title:\n"+req["title"]
          title=llm.generate(title_prompt).text.strip()
          report={"request_id":req["request_id"],"translated_title":title,"segments":out,"llm_evidence":batch.evidence}
          Path("result/result.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("HIDDEN_BEYOND_ON_DEMAND_AI_OK")
          PY
      - name: Upload AI result
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-ai-result
          path: result/
          if-no-files-found: error
