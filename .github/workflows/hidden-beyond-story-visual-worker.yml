name: Hidden Beyond Story Visual Worker

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hidden-beyond-story-visual-worker.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      STORY_PROCESSOR_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/story-processor-api
      OUTPUT_DIR: hidden-beyond-story-visual-output

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN"

      - name: Install AI package and FFmpeg
        shell: bash
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Preflight compile worker
        run: python -m py_compile scripts/hidden_beyond_story_visual_worker.py

      - name: Produce one verified Hidden Beyond story video
        run: python scripts/hidden_beyond_story_visual_worker.py

      - name: Upload worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-story-visual-output
          path: hidden-beyond-story-visual-output/
          if-no-files-found: warn
          retention-days: 7
