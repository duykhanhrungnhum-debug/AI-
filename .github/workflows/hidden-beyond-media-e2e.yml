name: Hidden Beyond Media E2E Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidden-beyond-media-e2e-smoke
  cancel-in-progress: false

jobs:
  media-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      PIPER_VOICE: vi_VN-vais1000-medium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Install AI-, Piper, and FFmpeg
        run: |
          python -m pip install -e .
          python -m pip install "piper-tts>=1.3,<2"
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          piper --help >/dev/null
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download Vietnamese Piper voice
        run: |
          mkdir -p piper-voices
          python -m piper.download_voices "$PIPER_VOICE" --download-dir piper-voices
          test -s "piper-voices/$PIPER_VOICE.onnx"
          test -s "piper-voices/$PIPER_VOICE.onnx.json"

      - name: Produce real script-to-video sample
        run: |
          mkdir -p media-e2e-output
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from ai_agent.core.episode_pipeline import MediaProductionPipeline
          from ai_agent.core.kaggle_image_batch import KaggleBatchImageProvider
          from ai_agent.core.kaggle_model import KaggleModelProvider
          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          from ai_agent.core.scene_planner import ScenePlanner
          from ai_agent.core.tts_model import PiperTTSProvider
          from ai_agent.core.video_builder import FFmpegVideoBuilder

          script = (
              "Vào một đêm mưa, Lan nhận được một bức thư cũ không có tên người gửi. "
              "Trong thư chỉ có một câu: Đừng mở cánh cửa cuối hành lang. "
              "Cô ngẩng lên và nghe thấy ba tiếng gõ vọng ra từ chính cánh cửa ấy."
          )

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
          )
          llm = KaggleModelProvider(
              worker=worker,
              model="Qwen/Qwen2.5-3B-Instruct",
              kernel_slug="ai-agent-e2e-scene-planner",
              poll_interval=15,
              max_poll_attempts=120,
              max_new_tokens=700,
              temperature=0.0,
          )
          scene_planner = ScenePlanner(llm, max_scenes=3)
          image_provider = KaggleBatchImageProvider(
              worker=worker,
              model="stable-diffusion-v1-5/stable-diffusion-v1-5",
              kernel_slug="ai-agent-e2e-images",
              poll_interval=15,
              max_poll_attempts=120,
              inference_steps=12,
              guidance_scale=7.0,
          )
          voice_name = os.environ["PIPER_VOICE"]
          speech_provider = PiperTTSProvider(
              model_path=f"piper-voices/{voice_name}.onnx",
              binary="piper",
              timeout=300,
              min_duration_seconds=1.0,
          )
          video_builder = FFmpegVideoBuilder(
              width=1280,
              height=720,
              fps=24,
              timeout=600,
          )
          pipeline = MediaProductionPipeline(
              scene_planner=scene_planner,
              image_provider=image_provider,
              speech_provider=speech_provider,
              video_builder=video_builder,
              image_width=512,
              image_height=288,
              max_image_rounds=2,
          )

          result = pipeline.produce(
              script,
              "media-e2e-output",
              visual_style=(
                  "cinematic mystery horror, realistic lighting, atmospheric fog, "
                  "consistent female protagonist named Lan, no gore"
              ),
          )
          if not result.media_ready:
              raise SystemExit("End-to-end media result is not media_ready")
          if result.audio.duration_seconds <= 1.0:
              raise SystemExit("Piper narration is unexpectedly short")
          if result.video.duration_seconds <= 1.0:
              raise SystemExit("FFmpeg video is unexpectedly short")
          if result.video.width != 1280 or result.video.height != 720:
              raise SystemExit("Final video resolution is not 1280x720")

          manifest = {
              "media_ready": result.media_ready,
              "scene_count": len(result.scene_plan.scenes),
              "audio": {
                  "provider": result.audio.provider,
                  "model": result.audio.model,
                  "duration_seconds": result.audio.duration_seconds,
                  "sample_rate": result.audio.sample_rate,
                  "channels": result.audio.channels,
                  "evidence": result.audio.evidence,
              },
              "video": {
                  "path": result.video.path,
                  "duration_seconds": result.video.duration_seconds,
                  "width": result.video.width,
                  "height": result.video.height,
                  "has_video": result.video.has_video,
                  "has_audio": result.video.has_audio,
                  "evidence": result.video.evidence,
              },
              "scenes": [
                  {
                      "scene_id": scene.scene_id,
                      "narration": scene.narration,
                      "image_prompt": scene.image_prompt,
                  }
                  for scene in result.scene_plan.scenes
              ],
              "evidence": result.evidence,
          }
          Path("media-e2e-output/manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("HIDDEN_BEYOND_MEDIA_E2E_OK")
          print(f"Scenes: {len(result.scene_plan.scenes)}")
          print(f"Piper seconds: {result.audio.duration_seconds:.3f}")
          print(f"Video seconds: {result.video.duration_seconds:.3f}")
          print(f"Video resolution: {result.video.width}x{result.video.height}")
          for evidence in result.video.evidence:
              print(evidence)
          PY

      - name: Upload final MP4 and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-media-e2e-output
          path: media-e2e-output/
          if-no-files-found: warn
          retention-days: 7
