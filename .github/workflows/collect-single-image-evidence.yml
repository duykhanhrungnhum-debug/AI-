name: Collect Single Image Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/single-image-evidence.trigger"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Collect latest single-image worker output
        shell: bash
        run: |
          mkdir -p single-image-evidence
          python - <<'PY'
          import os
          from pathlib import Path

          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
          )
          slug = "ai-agent-image-smoke"
          status = worker.status(slug)
          print("KAGGLE_STATUS", status.status, status.failure_message)
          if not status.terminal:
              raise RuntimeError("single image kernel is not terminal yet")

          target = Path("single-image-evidence")
          target.joinpath("generated.png").write_bytes(
              worker.download_output_file(slug, "generated.png")
          )
          target.joinpath("image_report.json").write_bytes(
              worker.download_output_file(slug, "image_report.json")
          )
          print("COLLECTED_SINGLE_IMAGE_EVIDENCE")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: single-image-failure-evidence
          path: single-image-evidence/
          if-no-files-found: error
          retention-days: 7
