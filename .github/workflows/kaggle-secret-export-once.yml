name: Kaggle Secret Export Once

on:
  push:
    branches: [main]
    paths:
      - ".github/kaggle-secret-export.trigger"

permissions:
  contents: write

jobs:
  export-secret:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Kaggle token
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "KAGGLE_API_TOKEN missing"; exit 1; }

      - name: Encrypt token for one-time transfer
        shell: bash
        run: |
          cat > /tmp/kaggle-transfer-public.pem <<'PEM'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvPLMR+7ykpgavYmZBIvR
18oB2fEJm4xnBk1V3PHqvp+hBDqv3qnAJMpMRbnN7S0R8NkqPpAQ9YKYPOckhpqv
DzMZ09JiSPEaIErIVVoIndsIPCvbTy9yTGRSTtbTTdFQjU1/x5iMKLROMa+BXcbT
ts3zO/KxrXAprquxkFUoXrpD4js207vNW99rraGN+bKSzWytTZCUmKwyMT1TCLkT
QKmzkKpJVMn7TAY4Sr0vdIu82fhQ+dD+rZZDcABFVFoiIU1M9TFxFTrfBPJ32l2d
A6CDklVmK4LJQG4ZD5smoBQTloAMdNXtI1YInvp4AF6uFj9j/wOh3LkzkNBUBLG8
YwIDAQAB
-----END PUBLIC KEY-----
PEM
          printf '%s' "$KAGGLE_API_TOKEN" \
            | openssl pkeyutl -encrypt -pubin \
                -inkey /tmp/kaggle-transfer-public.pem \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
            | base64 -w0 > .github/kaggle_token.enc

      - name: Commit encrypted transfer payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/kaggle_token.enc
          git commit -m "chore: encrypted Kaggle token transfer" || exit 0
          git push
