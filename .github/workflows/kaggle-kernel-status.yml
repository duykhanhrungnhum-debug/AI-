name: Kaggle Kernel Status Probe

on:
  workflow_dispatch:
    inputs:
      kernel_slug:
        description: "Kaggle kernel slug without owner"
        required: true
        default: "ai-agent-video-smoke"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/kaggle-kernel-status.trigger"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_KERNEL_SLUG: ${{ inputs.kernel_slug || 'ai-agent-video-smoke' }}
      OUTPUT_DIR: kaggle-kernel-status-output

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install AI package
        run: python -m pip install -e .

      - name: Inspect kernel status
        run: python scripts/kaggle_kernel_status.py

      - name: Upload status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-kernel-status-output
          path: kaggle-kernel-status-output/
          if-no-files-found: warn
          retention-days: 7
