name: AIKA Chat Image E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aika-chat-image-e2e.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Recover existing AIKA run only
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import time
          from pathlib import Path
          from PIL import Image
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          EXPECTED_PREFIX = "903dbc46"
          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
          )
          deadline = time.time() + 240
          report = None
          while time.time() < deadline:
              try:
                  raw = worker.download_output_file("ai-agent-image-v2", "image_v2_report.json")
                  candidate = json.loads(raw.decode("utf-8"))
                  token = str(candidate.get("run_token") or "")
                  print("RECOVERY_REPORT_TOKEN", token[:8], flush=True)
                  if token.startswith(EXPECTED_PREFIX):
                      report = candidate
                      break
              except Exception as exc:
                  print("RECOVERY_WAIT", type(exc).__name__, str(exc)[:200], flush=True)
              time.sleep(5)
          if report is None:
              raise TimeoutError("current AIKA run report did not appear")

          items = report.get("items")
          assert isinstance(items, dict) and len(items) == 2, report
          ordered = list(items.items())
          prompts = [str(item[1].get("prompt") or "") for item in ordered]
          folded = [prompt.casefold() for prompt in prompts]
          for prompt in folded:
              assert "crab" in prompt, prompts
              assert "frog" in prompt, prompts
              assert "starfish" not in prompt and "sea star" not in prompt, prompts
          assert any(x in folded[0] for x in ("realistic", "photo", "photoreal")), prompts[0]
          assert "3d" in folded[1], prompts[1]

          evidence = []
          for index, (item_id, item) in enumerate(ordered, 1):
              data = worker.download_output_file("ai-agent-image-v2", str(item["filename"]))
              assert data.startswith(b"\x89PNG\r\n\x1a\n")
              with Image.open(io.BytesIO(data)) as image:
                  assert image.size == (1024, 1024)
                  size = list(image.size)
              Path(f"aika-crab-frog-{index}.png").write_bytes(data)
              evidence.append({
                  "index": index,
                  "item_id": item_id,
                  "bytes": len(data),
                  "size": size,
                  "generation_seconds": float(item.get("elapsed_seconds") or 0),
                  "prompt": str(item.get("prompt") or ""),
              })

          clean = {
              "status": "success",
              "run_token": report.get("run_token"),
              "worker_total_seconds": report.get("worker_total_seconds"),
              "gpu_name": report.get("gpu_name"),
              "image_model": report.get("image_model"),
              "recaption_model": report.get("recaption_model"),
              "items": evidence,
          }
          Path("aika-crab-frog-report.json").write_text(
              json.dumps(clean, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("AIKA_CRAB_FROG_RECOVERY_OK")
          print(json.dumps(clean, ensure_ascii=False))
          PY
      - name: Upload recovered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aika-crab-frog-integrity-e2e
          path: |
            aika-crab-frog-1.png
            aika-crab-frog-2.png
            aika-crab-frog-report.json
          if-no-files-found: warn
          retention-days: 3
