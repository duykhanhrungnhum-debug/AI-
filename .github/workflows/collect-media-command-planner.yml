name: Collect Media Command Planner Output

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/media-command-planner-collect.trigger"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Collect latest planner output
        shell: bash
        run: |
          mkdir -p media-command-planner-evidence
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
          )
          slug = "ai-agent-media-command-planner"
          status = None
          for _ in range(60):
              status = worker.status(slug)
              print("KAGGLE_STATUS", status.status, status.failure_message)
              if status.terminal:
                  break
              time.sleep(10)
          if status is None or not status.terminal:
              raise TimeoutError("command planner kernel did not finish within 10 minutes")
          if not status.successful:
              raise RuntimeError(
                  "command planner kernel failed: "
                  + str(status.failure_message or status.status)
              )
          Path("media-command-planner-evidence/responses.json").write_bytes(
              worker.download_output_file(slug, "responses.json")
          )
          print("COLLECTED_MEDIA_COMMAND_PLANNER_OUTPUT")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: media-command-planner-evidence
          path: media-command-planner-evidence/
          if-no-files-found: error
          retention-days: 7
