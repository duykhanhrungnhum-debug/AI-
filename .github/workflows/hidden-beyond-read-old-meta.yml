name: Hidden Beyond Read Old Meta

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/read_old_meta.trigger"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read old metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -sS "https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hb-old-meta-first" -o meta.json
          python -m json.tool meta.json | head -n 220
