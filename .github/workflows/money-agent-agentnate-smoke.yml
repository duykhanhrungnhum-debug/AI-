name: Money Agent AgentNate Real Smoke

on:
  push:
    branches:
      - money-agent-agentnate-smoke
    paths:
      - .github/workflows/money-agent-agentnate-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: money-agent-agentnate-smoke

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Kaggle secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"

      - name: Run real AgentNate creative smoke
        run: python tmp/run_agentnate_money_smoke.py

      - name: Commit real outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smoke-results/agentnate_image.png smoke-results/agentnate_video.mp4 smoke-results/agentnate_smoke_report.json
          git commit -m "Store AgentNate real smoke outputs"
          git push origin HEAD:money-agent-agentnate-smoke
