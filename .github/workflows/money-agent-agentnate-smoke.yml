name: Money Agent AgentNate Real Smoke

on:
  push:
    branches:
      - money-agent-agentnate-smoke
    paths:
      - .github/workflows/money-agent-agentnate-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: money-agent-agentnate-smoke

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Kaggle secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"

      - name: Run real AgentNate creative smoke
        id: smoke
        shell: bash
        run: |
          mkdir -p smoke-results
          set +e
          python tmp/run_agentnate_money_smoke.py > >(tee smoke-results/runner.log) 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Commit smoke outputs or failure log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smoke-results/ || true
          if git diff --cached --quiet; then
            echo "No smoke files to commit"
            exit 0
          fi
          git commit -m "Store AgentNate smoke result"
          git push origin HEAD:money-agent-agentnate-smoke

