name: Reference Motion Video Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/reference-motion-video-smoke.trigger"
      - ".github/reference-motion-video-smoke.resume"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  reference-motion-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      PRODUCTION_LEARNING_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/story-processor-api
      VIDEO_OUTPUT_DIR: reference-motion-video-smoke-output
      VIDEO_REFERENCE_IMAGE: reference-motion-video-smoke-output/reference.png
      VIDEO_SCRIPT: "Một ông lão bước vào thư viện cổ, dừng bên chiếc bàn gỗ và mở một tấm bản đồ cũ dưới ánh đèn ấm."
      VIDEO_MAX_SCENES: "1"
      VIDEO_IMAGE_WIDTH: "512"
      VIDEO_IMAGE_HEIGHT: "288"
      VIDEO_IMAGE_STEPS: "12"
      VIDEO_IMAGE_ROUNDS: "2"
      VIDEO_MOTION_FRAMES: "14"
      VIDEO_MOTION_FPS: "7"
      VIDEO_MOTION_ROUNDS: "2"
      VIDEO_FINAL_WIDTH: "1280"
      VIDEO_FINAL_HEIGHT: "720"
      VIDEO_FINAL_FPS: "30"
      VIDEO_COMPOSITION: "16:9 widescreen"
      PIPER_VOICE: vi_VN-vais1000-medium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        shell: bash
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install package, Piper, and FFmpeg
        shell: bash
        run: |
          python -m pip install -e .
          python -m pip install "piper-tts>=1.3,<2"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Vietnamese Piper voice and reference image
        shell: bash
        run: |
          mkdir -p piper-voices "$VIDEO_OUTPUT_DIR"
          python -m piper.download_voices "$PIPER_VOICE" --download-dir piper-voices
          test -s "piper-voices/$PIPER_VOICE.onnx"
          test -s "piper-voices/$PIPER_VOICE.onnx.json"
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          url = (
              "https://huggingface.co/datasets/huggingface/documentation-images/"
              "resolve/main/diffusers/ip_adapter_einstein_base.png"
          )
          with urlopen(url, timeout=60) as response:
              data = response.read()
          if len(data) < 10_000:
              raise RuntimeError("reference image download is unexpectedly small")
          Path("reference-motion-video-smoke-output/reference.png").write_bytes(data)
          PY

      - name: Restore prior verified keyframes when requested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s .github/reference-motion-video-smoke.resume ]; then
            RESUME_RUN_ID="$(tr -cd '0-9' < .github/reference-motion-video-smoke.resume)"
            test -n "$RESUME_RUN_ID"
            gh run download "$RESUME_RUN_ID" \
              -n reference-motion-video-smoke \
              -D "$VIDEO_OUTPUT_DIR"
            test -n "$(find "$VIDEO_OUTPUT_DIR" -maxdepth 1 -name 'scene_*_keyframe.png' -print -quit)"
            echo "VIDEO_REUSE_EXISTING_KEYFRAMES=1" >> "$GITHUB_ENV"
            echo "RESUMED_FROM_RUN_ID=$RESUME_RUN_ID" >> "$GITHUB_ENV"
          fi

      - name: Compile reference motion pipeline
        run: >-
          python -m py_compile
          src/ai_agent/core/kaggle_i2v.py
          src/ai_agent/core/kaggle_image_batch.py
          src/ai_agent/core/reference_motion_pipeline.py
          src/ai_agent/core/production_learning.py
          scripts/generate_reference_motion_video.py

      - name: Generate real script plus reference moving video
        run: python scripts/generate_reference_motion_video.py

      - name: Upload reference motion video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-motion-video-smoke
          path: reference-motion-video-smoke-output/
          if-no-files-found: warn
          retention-days: 7
