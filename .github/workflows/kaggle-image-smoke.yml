name: Kaggle Image Smoke


on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/kaggle-image-smoke.trigger"

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Install AI package
        run: python -m pip install -e .

      - name: Generate one real image on Kaggle T4
        run: |
          mkdir -p kaggle-image-output
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from ai_agent.core.image_model import ImageGenerationRequest
          from ai_agent.core.kaggle_image import KaggleImageProvider
          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          from ai_agent.core.media_command import MASCOT_PREMIUM, image_model_config

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          model_config = image_model_config(MASCOT_PREMIUM)
          provider = KaggleImageProvider(
              worker=worker,
              model=model_config.model,
              kernel_slug="ai-agent-image-smoke",
              poll_interval=15,
              max_poll_attempts=160,
              inference_steps=model_config.inference_steps,
              guidance_scale=model_config.guidance_scale,
              scheduler=model_config.scheduler,
              prompt_alignment_threshold=0.22,
              visual_quality_margin_threshold=0.015,
              quality_good_text=model_config.quality_good_text,
              quality_bad_texts=model_config.quality_bad_texts,
          )
          request = ImageGenerationRequest(
              prompt=(
                  "premium polished cute 3D mascot asset, EXACTLY ONE red-orange crab and NO other crabs, "
                  "one complete body centered on exactly one fresh green lily pad, two clean symmetrical claws, "
                  "coherent crab legs, two large expressive glossy eyes, friendly joyful smile, polished rounded shell, "
                  "tiny water droplets, crisp cutout-ready silhouette, studio-quality materials, soft cinematic lighting"
              ),
              negative_prompt=(
                  "multiple crabs, two crabs, group of crabs, repeated crab, duplicate character, crowd, duplicate body, "
                  "text, watermark, logo, blurry, low quality, malformed claws, extra claws, extra legs, duplicated limbs, "
                  "asymmetrical broken anatomy, melted geometry, warped shell, messy outline, obvious AI artifacts"
              ),
              width=1024,
              height=1024,
              seed=42,
          )
          try:
              artifact = provider.generate(request)
          except Exception:
              # Preserve the actual rejected candidate for visual diagnosis without another GPU run.
              try:
                  Path("kaggle-image-output/generated.png").write_bytes(
                      worker.download_output_file("ai-agent-image-smoke", "generated.png")
                  )
                  Path("kaggle-image-output/image_report.json").write_bytes(
                      worker.download_output_file("ai-agent-image-smoke", "image_report.json")
                  )
              finally:
                  raise

          image_path = Path("kaggle-image-output/generated.png")
          image_path.write_bytes(artifact.data)
          Path("kaggle-image-output/evidence.json").write_text(
              json.dumps({
                  "provider": artifact.provider,
                  "model": artifact.model,
                  "evidence": artifact.evidence,
                  "size_bytes": len(artifact.data),
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print("KAGGLE_IMAGE_SMOKE_OK")
          print(f"Image bytes: {len(artifact.data)}")
          for item in artifact.evidence:
              print(item)
          PY

      - name: Upload generated image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-image-smoke-output
          path: kaggle-image-output/
          if-no-files-found: warn
