name: Hidden Beyond Source Download Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hidden-beyond-source-download-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidden-beyond-source-download-smoke
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_KERNEL_SLUG: hidden-beyond-source-download-smoke
      SOURCE_URL: https://www.youtube.com/watch?v=vaY4URFw0cg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI package
        run: python -m pip install -e .
      - name: Submit Kaggle download probe
        run: |
          python - <<'PY'
          import json, os, textwrap
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          url=os.environ["SOURCE_URL"]
          source=textwrap.dedent(f"""
          import json, subprocess, sys
          from pathlib import Path

          URL={url!r}
          subprocess.check_call([sys.executable,"-m","pip","install","--quiet","yt-dlp"])
          meta=subprocess.check_output([
              sys.executable,"-m","yt_dlp",
              "--no-playlist","--skip-download","--dump-single-json",URL
          ], text=True)
          d=json.loads(meta)
          report={{
              "ok": True,
              "id": d.get("id"),
              "title": d.get("title"),
              "duration": d.get("duration"),
              "extractor": d.get("extractor"),
              "webpage_url": d.get("webpage_url"),
          }}
          Path("/kaggle/working/probe.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8"
          )
          subprocess.check_call([
              sys.executable,"-m","yt_dlp",
              "--no-playlist",
              "--download-sections","*0-20",
              "-f","bv*[height<=360]+ba/b[height<=360]",
              "--merge-output-format","mp4",
              "-o","/kaggle/working/sample.%(ext)s",
              URL
          ])
          print("HIDDEN_BEYOND_SOURCE_DOWNLOAD_OK")
          print(json.dumps(report,ensure_ascii=False))
          """)
          worker=KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          s=worker.submit_script(
              slug=os.environ["KAGGLE_KERNEL_SLUG"],
              title="Hidden Beyond Source Download Smoke",
              source=source,
              enable_internet=True,
              is_private=True,
          )
          print("submitted",s.ref,s.version_number)
          PY
      - name: Wait for Kaggle
        run: |
          python - <<'PY'
          import os,time
          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          w=KaggleGpuWorker(api_token=os.environ["KAGGLE_API_TOKEN"],username=os.environ["KAGGLE_USERNAME"])
          for i in range(1,81):
              s=w.status(os.environ["KAGGLE_KERNEL_SLUG"])
              print(i,s.status,s.failure_message)
              if s.terminal:
                  if not s.successful:
                      raise SystemExit("Kaggle failed: "+s.status+" "+s.failure_message)
                  break
              time.sleep(15)
          else:
              raise SystemExit("Timed out")
          PY
      - name: Verify probe
        run: |
          python - <<'PY'
          import json,os
          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          w=KaggleGpuWorker(api_token=os.environ["KAGGLE_API_TOKEN"],username=os.environ["KAGGLE_USERNAME"])
          data=w.download_output_file(os.environ["KAGGLE_KERNEL_SLUG"],"probe.json")
          d=json.loads(data)
          print(json.dumps(d,ensure_ascii=False,indent=2))
          if d.get("id")!="vaY4URFw0cg" or not d.get("duration"):
              raise SystemExit("Unexpected probe")
          print("SOURCE_DOWNLOAD_PROBE_VERIFIED")
          PY
