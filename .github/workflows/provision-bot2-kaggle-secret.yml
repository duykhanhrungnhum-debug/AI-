name: Provision Bot2 Kaggle Secret

on:
  push:
    branches: [main]
    paths:
      - ".github/provision-bot2-kaggle.trigger"

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      BROKER_URL: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/hidden-beyond-kaggle-broker/provision
    steps:
      - name: Require AI project Kaggle credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error::AI- KAGGLE_API_TOKEN missing"; exit 2; }

      - name: Provision token into Supabase Vault broker
        shell: bash
        run: |
          set -Eeuo pipefail
          OIDC="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-kaggle-broker"             | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          export OIDC_TOKEN="$OIDC"
          python - <<'PY'
          import json,os,urllib.request
          body=json.dumps({"token":os.environ["KAGGLE_API_TOKEN"]}).encode()
          req=urllib.request.Request(
              os.environ["BROKER_URL"],
              data=body,
              method="POST",
              headers={
                  "Authorization":"Bearer "+os.environ["OIDC_TOKEN"],
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req,timeout=60) as r:
              data=json.loads(r.read().decode())
          if data.get("stage")!="provisioned":
              raise SystemExit("Unexpected broker response")
          print("BOT2_KAGGLE_SECRET_PROVISIONED")
          PY
