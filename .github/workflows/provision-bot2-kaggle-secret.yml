name: Provision Bot2 Kaggle Secret

on:
  push:
    branches: [main]
    paths:
      - ".github/provision-bot2-kaggle.trigger"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      CROSS_REPO_TOKEN: ${{ secrets.HIDDEN_BEYOND_GITHUB_TOKEN }}
      TARGET_REPO: duykhanhrungnhum-debug/mystery-video
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require existing AI project credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error::AI- KAGGLE_API_TOKEN missing"; exit 2; }
          test -n "${CROSS_REPO_TOKEN:-}" || { echo "::error::AI- HIDDEN_BEYOND_GITHUB_TOKEN missing"; exit 3; }

      - name: Securely provision Kaggle token to Bot2 repo
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet pynacl
          python - <<'PY'
          import base64,json,os,urllib.request
          from nacl import encoding, public

          repo=os.environ["TARGET_REPO"]
          gh=os.environ["CROSS_REPO_TOKEN"]
          kaggle=os.environ["KAGGLE_API_TOKEN"]

          def api(url, method="GET", body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(
                  url,data=data,method=method,
                  headers={
                      "Authorization":"Bearer "+gh,
                      "Accept":"application/vnd.github+json",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "Content-Type":"application/json",
                  },
              )
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read().decode()
                  return json.loads(raw) if raw else {}

          key=api(f"https://api.github.com/repos/{repo}/actions/secrets/public-key")
          public_key=public.PublicKey(key["key"].encode(),encoding.Base64Encoder())
          sealed=public.SealedBox(public_key).encrypt(kaggle.encode())
          encrypted=base64.b64encode(sealed).decode()

          api(
              f"https://api.github.com/repos/{repo}/actions/secrets/KAGGLE_API_TOKEN",
              method="PUT",
              body={"encrypted_value":encrypted,"key_id":key["key_id"]},
          )
          print("BOT2_KAGGLE_SECRET_PROVISIONED")
          PY
