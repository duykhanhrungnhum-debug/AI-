name: Image V2 Smoke

on:
  workflow_dispatch:
    inputs:
      commands_json:
        description: Natural-language image requests as JSON list
        required: false
        default: '[{"id":"dual_portrait","command":"Tạo một ảnh chân dung thời trang chân thực của hai phụ nữ trưởng thành trẻ khoảng 22-25 tuổi đứng cạnh nhau: một cô gái Đông Á và một cô gái châu Âu. Cả hai đều trẻ trung, xinh đẹp, sắc sảo, thần thái tự tin, đường nét khuôn mặt rõ và khác biệt tự nhiên theo vùng, mắt biểu cảm, tóc đẹp, trang điểm tinh tế. Trang phục thời trang hiện đại thanh lịch, không khỏa thân. Bố cục từ eo trở lên, cả hai nhân vật hiện rõ và cân đối, ánh sáng studio điện ảnh, da và khuôn mặt chân thực, chất lượng ảnh editorial cao cấp, nền sạch hơi mờ."}]'
  push:
    branches: [main]
    paths:
      - ".github/image-v2-smoke.trigger"

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      MEDIA_OUTPUT_DIR: image-v2-output
      MEDIA_COMMANDS_JSON: ${{ inputs.commands_json || '[{"id":"dual_portrait","command":"Tạo một ảnh chân dung thời trang chân thực của hai phụ nữ trưởng thành trẻ khoảng 22-25 tuổi đứng cạnh nhau: một cô gái Đông Á và một cô gái châu Âu. Cả hai đều trẻ trung, xinh đẹp, sắc sảo, thần thái tự tin, đường nét khuôn mặt rõ và khác biệt tự nhiên theo vùng, mắt biểu cảm, tóc đẹp, trang điểm tinh tế. Trang phục thời trang hiện đại thanh lịch, không khỏa thân. Bố cục từ eo trở lên, cả hai nhân vật hiện rõ và cân đối, ánh sáng studio điện ảnh, da và khuôn mặt chân thực, chất lượng ảnh editorial cao cấp, nền sạch hơi mờ."}]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Generate through the only V2 image path
        run: python scripts/generate_image_v2.py

      - name: Verify technical output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("image-v2-output/manifest.json").read_text(encoding="utf-8"))
          assert manifest["architecture"] == "natural_request->single_recaption->flux2_klein"
          assert manifest["runtime_visual_qa"] is False
          assert manifest["items"]
          for item_id in manifest["items"]:
              image = Path("image-v2-output") / item_id / "image.png"
              assert image.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          print("IMAGE_V2_TECHNICAL_OK")
          PY

      - name: Upload images for human regression review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-v2-output
          path: image-v2-output/
          if-no-files-found: error
          retention-days: 7
