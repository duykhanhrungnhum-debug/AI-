name: Collect Reference Image Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/reference-image-failure-collect.trigger"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Collect latest reference-image worker outputs
        shell: bash
        run: |
          mkdir -p reference-image-evidence
          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile
          from io import BytesIO

          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
          )
          slug = "ai-agent-reference-video-smoke"
          status = worker.status(slug)
          print("KAGGLE_STATUS", status.status, status.failure_message)
          if not status.terminal:
              raise RuntimeError("reference image kernel is not terminal yet")

          archive = worker.download_output_file(slug, "images.zip")
          report = worker.download_output_file(slug, "batch_report.json")

          target = Path("reference-image-evidence")
          (target / "images.zip").write_bytes(archive)
          (target / "batch_report.json").write_bytes(report)
          with zipfile.ZipFile(BytesIO(archive), "r") as zipped:
              zipped.extractall(target / "images")
          print("COLLECTED_REFERENCE_IMAGE_EVIDENCE")
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: reference-image-failure-evidence
          path: reference-image-evidence/
          if-no-files-found: error
          retention-days: 7
