name: Kaggle GPU Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle-gpu-smoke.yml"
      - "kaggle/gpu-smoke/**"
      - "src/ai_agent/core/kaggle_worker.py"

permissions:
  contents: read

concurrency:
  group: kaggle-gpu-smoke
  cancel-in-progress: false

jobs:
  gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_KERNEL_SLUG: ai-agent-gpu-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Kaggle API token shape
        shell: bash
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN repository secret is not configured."
            exit 1
          fi
          python - <<'PY'
          import os
          token = os.environ["KAGGLE_API_TOKEN"]
          cleaned = token.strip()
          print(f"Token starts with KGAT_: {cleaned.startswith('KGAT_')}")
          print(f"Token length after trim: {len(cleaned)}")
          print(f"Whitespace was trimmed: {cleaned != token}")
          if len(cleaned) < 20:
              raise SystemExit("Kaggle API token is unexpectedly short")
          PY

      - name: Install AI package
        run: python -m pip install -e .

      - name: Submit Kaggle GPU smoke job through REST
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          source = Path("kaggle/gpu-smoke/gpu_smoke.py").read_text(encoding="utf-8")
          submission = worker.submit_script(
              slug=os.environ["KAGGLE_KERNEL_SLUG"],
              title="AI Agent GPU Smoke",
              source=source,
              enable_internet=False,
              is_private=True,
          )
          print(f"Kaggle submission accepted: {submission.ref}")
          print(f"Version: {submission.version_number}")
          print(f"URL: {submission.url}")
          PY

      - name: Wait for Kaggle GPU job
        run: |
          python - <<'PY'
          import os
          import time

          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          slug = os.environ["KAGGLE_KERNEL_SLUG"]

          for attempt in range(1, 61):
              status = worker.status(slug)
              print(f"Poll {attempt}: {status.status}")
              if status.terminal:
                  if not status.successful:
                      raise SystemExit(
                          f"Kaggle GPU job failed: {status.status} {status.failure_message}"
                      )
                  break
              time.sleep(15)
          else:
              raise SystemExit("Timed out waiting for Kaggle GPU job")
          PY

      - name: Download and verify GPU evidence
        run: |
          mkdir -p kaggle-output
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          data = worker.download_output_file(
              os.environ["KAGGLE_KERNEL_SLUG"],
              "gpu_report.json",
          )
          path = Path("kaggle-output/gpu_report.json")
          path.write_bytes(data)

          report = json.loads(data.decode("utf-8"))
          if report.get("gpu_available") is not True:
              raise SystemExit(f"GPU smoke test failed: {report}")
          if not str(report.get("gpu_name", "")).strip():
              raise SystemExit("GPU report does not contain a GPU name")

          print("KAGGLE_GPU_SMOKE_OK")
          print(f"GPU: {report['gpu_name']}")
          print(f"GPU memory MiB: {report.get('memory_total_mib')}")
          print(f"CUDA visible devices: {report.get('cuda_visible_devices')}")
          PY

      - name: Upload GPU smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-gpu-smoke-evidence
          path: kaggle-output/
          if-no-files-found: warn
