name: Release Kaggle GPU Session

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-kaggle-gpu-session.yml"
  workflow_dispatch:

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Released stale Kaggle GPU workflow concurrency slot."
