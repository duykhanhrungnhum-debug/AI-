name: Lightning 8B Quality Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lightning-8b-audit.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: test -n "$KAGGLE_API_TOKEN"

      - run: python -m pip install -e .

      - name: Download Lightning image
        run: |
          mkdir -p audit-input audit-output
          gh run download 36572396460 -n natural-dog-photo-output -D audit-input

      - name: Run strict Qwen3-VL 8B audit
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          from ai_agent.core.media_command import ANIMAL_PHOTO_PREMIUM, benchmark_manifest
          from ai_agent.core.vision_quality import KaggleVisionQualityVerifier, VisionQualityRequest

          image_path = Path("audit-input/real/image.png")
          rubric = tuple(
              benchmark_manifest()["profiles"][ANIMAL_PHOTO_PREMIUM.name]["must_pass"]
          )
          request = VisionQualityRequest(
              item_id="lightning-dog",
              image=image_path.read_bytes(),
              prompt=(
                  "one real Golden Retriever walking naturally on grass outdoors, ordinary natural daylight, "
                  "full body, correct canine anatomy, realistic irregular fur, moderate contrast and saturation, "
                  "natural unretouched camera photo, no HDR, no advertising retouch, no oversharpening"
              ),
              profile=ANIMAL_PHOTO_PREMIUM.name,
              rubric=rubric,
              expected_subject_count=1,
          )
          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          verifier = KaggleVisionQualityVerifier(
              worker=worker,
              model="Qwen/Qwen3-VL-8B-Instruct",
              kernel_slug="ai-agent-lightning-8b-audit",
              poll_interval=3,
              max_poll_attempts=600,
              min_quality_score=9.0,
              min_prompt_match_score=9.0,
              attention_backend="sdpa",
          )
          started = time.monotonic()
          result = verifier.verify(request)
          elapsed = round(time.monotonic() - started, 3)
          payload = {
              "elapsed_seconds": elapsed,
              "passed": result.passed,
              "quality_score": result.quality_score,
              "prompt_match_score": result.prompt_match_score,
              "structure_score": result.structure_score,
              "detail_score": result.detail_score,
              "aesthetic_score": result.aesthetic_score,
              "composition_score": result.composition_score,
              "benchmark_match_score": result.benchmark_match_score,
              "major_issues": list(result.major_issues),
              "minor_issues": list(result.minor_issues),
              "evidence": list(result.evidence),
              "review_text": result.review_text,
          }
          Path("audit-output/lightning-8b-audit.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          if not result.passed:
              raise RuntimeError("Lightning image failed strict 8B quality audit")
          PY

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-8b-audit-output
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7
