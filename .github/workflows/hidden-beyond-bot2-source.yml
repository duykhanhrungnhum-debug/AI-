name: Hidden Beyond Bot2 Source

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/bot2_source.trigger"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yt-dlp and ffmpeg
        run: |
          python -m pip install --quiet "yt-dlp>=2026.1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download full authorized source on GitHub
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://www.youtube.com/watch?v=vaY4URFw0cg"
          rm -f source.mp4
          SUCCESS=0
          for CLIENTS in "default" "android_vr,web_safari" "tv,mweb"; do
            rm -f source.mp4
            ARGS=()
            if [ "$CLIENTS" != "default" ]; then
              ARGS+=(--extractor-args "youtube:player_client=$CLIENTS")
            fi
            if python -m yt_dlp --no-playlist --retries 5 --fragment-retries 5               --remote-components ejs:github               "${ARGS[@]}"               -f "bv*[height<=720]+ba/b[height<=720]/b"               --merge-output-format mp4 -o source.mp4 "$URL"; then
              if [ -s source.mp4 ]; then
                SUCCESS=1
                echo "SOURCE_CLIENTS=$CLIENTS"
                break
              fi
            fi
          done
          test "$SUCCESS" = "1"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 source.mp4 | grep -q video
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 source.mp4 | grep -q audio
          echo "BOT2_SOURCE_READY bytes=$(stat -c%s source.mp4)"
      - name: Preserve full source
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-bot2-source
          path: source.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
