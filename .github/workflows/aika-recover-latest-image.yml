name: AIKA Recover Latest Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aika-recover-latest-image.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Recover latest completed AIKA image artifact only
        run: |
          python - <<'PY'
          import io, json, os
          from pathlib import Path
          from PIL import Image
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=45,
          )
          raw = worker.download_output_file("ai-agent-image-v2", "image_v2_report.json")
          report = json.loads(raw.decode("utf-8"))
          print("RECOVER_REPORT", json.dumps(report, ensure_ascii=False), flush=True)
          items = report.get("items") or {}
          if len(items) != 2:
              raise RuntimeError(f"expected 2 completed images, got {len(items)}")
          prompts = []
          evidence = []
          for index, (item_id, item) in enumerate(items.items(), 1):
              prompt = str(item.get("prompt") or "")
              folded = prompt.casefold()
              if "crab" not in folded or "frog" not in folded:
                  raise RuntimeError(f"semantic mismatch in {item_id}: {prompt}")
              if "starfish" in folded or "sea star" in folded:
                  raise RuntimeError(f"forbidden substitution in {item_id}: {prompt}")
              filename = str(item["filename"])
              data = worker.download_output_file("ai-agent-image-v2", filename)
              with Image.open(io.BytesIO(data)) as image:
                  size = list(image.size)
                  if tuple(image.size) != (1024, 1024):
                      raise RuntimeError(f"bad image size {image.size}")
              out = Path(f"aika-recovered-{index}.png")
              out.write_bytes(data)
              prompts.append(prompt)
              evidence.append({"item_id": item_id, "filename": filename, "bytes": len(data), "size": size, "elapsed_seconds": item.get("elapsed_seconds")})
          if not any(x in prompts[0].casefold() for x in ("realistic", "photo", "photoreal")):
              raise RuntimeError("first image is not realistic")
          if "3d" not in prompts[1].casefold() or not any(x in prompts[1].casefold() for x in ("cartoon", "animated", "stylized")):
              raise RuntimeError("second image is not 3D cartoon")
          summary = {
              "status": "success",
              "run_token": report.get("run_token"),
              "gpu_name": report.get("gpu_name"),
              "worker_total_seconds": report.get("worker_total_seconds"),
              "prompts": prompts,
              "images": evidence,
          }
          Path("aika-recovered-report.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print("AIKA_RECOVER_OK", json.dumps(summary, ensure_ascii=False), flush=True)
          PY
      - name: Upload recovered evidence
        uses: actions/upload-artifact@v4
        with:
          name: aika-recovered-crab-frog
          path: |
            aika-recovered-1.png
            aika-recovered-2.png
            aika-recovered-report.json
          if-no-files-found: error
          retention-days: 3
