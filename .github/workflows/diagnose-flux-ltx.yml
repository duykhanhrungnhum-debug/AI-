name: Diagnose FLUX LTX Failure

on:
  push:
    branches:
      - money-agent-flux-ltx-smoke
    paths:
      - .github/workflows/diagnose-flux-ltx.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAGGLE_USERNAME: duykhanhta
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: money-agent-flux-ltx-smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose recent Kaggle smoke
        run: python tmp/diagnose_flux_ltx.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flux-ltx-diagnostic
          path: diag-results/
          if-no-files-found: warn

# rerun with stripped token
