name: Vision QA Speed Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vision-qa-speed-smoke.yml"
      - ".github/vision-qa-speed-smoke.trigger"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  qa-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install package
        run: python -m pip install -e .

      - name: Download existing verified natural dog image
        run: |
          mkdir -p qa-input qa-output
          gh run download 36543378475 -n natural-dog-photo-output -D qa-input
          find qa-input -maxdepth 3 -type f -print

      - name: Benchmark hybrid Qwen3-VL QA
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import time

          from ai_agent.core.kaggle_worker import KaggleGpuWorker
          from ai_agent.core.media_command import ANIMAL_PHOTO_PREMIUM, benchmark_manifest
          from ai_agent.core.vision_quality import HybridVisionQualityVerifier, VisionQualityRequest

          image_path = Path("qa-input/real/image.png")
          if not image_path.exists():
              image_path = Path("qa-input/real/candidate.png")
          if not image_path.exists():
              raise FileNotFoundError("verified natural dog artifact not found")

          rubric = tuple(
              benchmark_manifest()["profiles"][ANIMAL_PHOTO_PREMIUM.name]["must_pass"]
          )
          request = VisionQualityRequest(
              item_id="natural-dog-existing",
              image=image_path.read_bytes(),
              prompt=(
                  "one real Golden Retriever walking naturally on grass outdoors, ordinary natural daylight, "
                  "full body, correct canine anatomy, realistic irregular fur, moderate contrast and saturation, "
                  "natural unretouched camera photo, no HDR, no advertising retouch, no oversharpening"
              ),
              profile=ANIMAL_PHOTO_PREMIUM.name,
              rubric=rubric,
              expected_subject_count=1,
          )

          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
          )
          verifier = HybridVisionQualityVerifier(
              worker=worker,
              kernel_slug="ai-agent-vision-qa-speed-smoke",
              poll_interval=15,
              max_poll_attempts=120,
              min_quality_score=9.0,
              min_prompt_match_score=9.0,
              clear_pass_score=9.0,
              fast_reject_score=8.0,
          )
          start = time.monotonic()
          result = verifier.verify(request)
          elapsed = round(time.monotonic() - start, 3)

          payload = {
              "elapsed_seconds": elapsed,
              "baseline_qa_seconds": 670,
              "baseline_source_run": 36543378475,
              "passed": result.passed,
              "quality_score": result.quality_score,
              "prompt_match_score": result.prompt_match_score,
              "structure_score": result.structure_score,
              "detail_score": result.detail_score,
              "aesthetic_score": result.aesthetic_score,
              "composition_score": result.composition_score,
              "benchmark_match_score": result.benchmark_match_score,
              "major_issues": list(result.major_issues),
              "minor_issues": list(result.minor_issues),
              "evidence": list(result.evidence),
          }
          Path("qa-output/qa-speed.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          if not result.passed:
              raise RuntimeError("optimized QA rejected the previously verified natural dog image")
          PY

      - name: Upload QA benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-qa-speed-output
          path: qa-output/
          if-no-files-found: warn
          retention-days: 7
