name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile Hidden Beyond longform workers
        run: >-
          python -m py_compile
          hidden_beyond/longform_audio_worker_v3.py
          hidden_beyond/benchmark_v3_worker.py
          scripts/submit_hidden_beyond_audio_worker.py
          src/ai_agent/core/kaggle_video.py
          src/ai_agent/core/generative_video_pipeline.py
          scripts/kaggle_video_smoke.py
          scripts/generate_ai_video.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Smoke test public Internet retrieval and verification
        run: >-
          python -c "from ai_agent.core.researcher import InternetResearcher;
          from ai_agent.core.learning import LearningEngine;
          d=InternetResearcher(timeout=15.0, max_bytes=1000000).fetch('https://example.com/');
          assert d.uri == 'https://example.com/';
          assert d.content_hash and len(d.content) > 0;
          e=LearningEngine();
          item=e.observe('example.com is reachable', d);
          e.verify(item, ['Live public HTTP retrieval succeeded and produced a content hash.']);
          assert item.status.value == 'verified'"
