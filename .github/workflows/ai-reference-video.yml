name: AI Reference Video On Demand

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Verified script to turn into a narrated reference-character video"
        required: true
        type: string
      reference_image_url:
        description: "HTTPS URL for the character reference image"
        required: true
        type: string
      visual_style:
        description: "Visual direction for all generated scenes"
        required: false
        default: "cinematic story illustration, coherent recurring character, detailed environment"
        type: string
      max_scenes:
        description: "Maximum number of scenes"
        required: false
        default: "7"
        type: string
      image_steps:
        description: "Image diffusion inference steps"
        required: false
        default: "16"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/ai-reference-video.trigger"

permissions:
  contents: read
  id-token: write

concurrency:
  group: kaggle-gpu-session
  cancel-in-progress: false

jobs:
  generate-reference-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      PRODUCTION_LEARNING_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/story-processor-api
      VIDEO_SCRIPT: ${{ inputs.script || 'Một ông lão bước vào thư viện cổ trong ánh đèn ấm. Ông dừng lại bên chiếc bàn gỗ, mở tấm bản đồ cũ và chăm chú tìm một dấu hiệu bí mật.' }}
      REFERENCE_IMAGE_URL: ${{ inputs.reference_image_url || 'https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/ip_adapter_einstein_base.png' }}
      VIDEO_VISUAL_STYLE: ${{ inputs.visual_style || 'cinematic realistic story illustration, same elderly man, warm natural light, coherent recurring character' }}
      VIDEO_MAX_SCENES: ${{ inputs.max_scenes || '2' }}
      VIDEO_IMAGE_STEPS: ${{ inputs.image_steps || '12' }}
      VIDEO_IMAGE_ROUNDS: "2"
      VIDEO_IMAGE_WIDTH: "512"
      VIDEO_IMAGE_HEIGHT: "288"
      VIDEO_FINAL_WIDTH: "1280"
      VIDEO_FINAL_HEIGHT: "720"
      VIDEO_FINAL_FPS: "24"
      VIDEO_IDENTITY_THRESHOLD: "0.40"
      VIDEO_IP_ADAPTER_WEIGHT: "ip-adapter-full-face_sd15.bin"
      VIDEO_REFERENCE_IMAGE: reference-input.png
      VIDEO_OUTPUT_DIR: ai-reference-video-output
      PIPER_VOICE: vi_VN-vais1000-medium
      PIPER_VOICE_DIR: piper-voices

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Kaggle token
        shell: bash
        run: test -n "$KAGGLE_API_TOKEN"

      - name: Install package, Piper, and FFmpeg
        shell: bash
        run: |
          python -m pip install -e .
          python -m pip install "piper-tts>=1.3,<2"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Vietnamese Piper voice
        shell: bash
        run: |
          mkdir -p "$PIPER_VOICE_DIR"
          python -m piper.download_voices "$PIPER_VOICE" --download-dir "$PIPER_VOICE_DIR"
          test -s "$PIPER_VOICE_DIR/$PIPER_VOICE.onnx"
          test -s "$PIPER_VOICE_DIR/$PIPER_VOICE.onnx.json"

      - name: Download reference image
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = os.environ["REFERENCE_IMAGE_URL"].strip()
          if not url.startswith("https://"):
              raise RuntimeError("reference_image_url must use HTTPS")
          request = Request(url, headers={"User-Agent":"AI-Agent-Reference-Video/1.0"})
          with urlopen(request, timeout=60) as response:
              data = response.read()
          if len(data) < 10_000:
              raise RuntimeError("reference image download is unexpectedly small")
          Path(os.environ["VIDEO_REFERENCE_IMAGE"]).write_bytes(data)
          print("REFERENCE_IMAGE_READY", len(data))
          PY

      - name: Preflight compile
        run: >-
          python -m py_compile
          src/ai_agent/core/production_learning.py
          src/ai_agent/core/kaggle_image_batch.py
          src/ai_agent/core/episode_pipeline.py
          scripts/generate_reference_video.py

      - name: Generate complete reference-character video
        run: python scripts/generate_reference_video.py

      - name: Upload final video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reference-video-output
          path: ai-reference-video-output/
          if-no-files-found: warn
          retention-days: 7
