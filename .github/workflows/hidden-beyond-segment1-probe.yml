name: Hidden Beyond Segment1 Probe

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/segment1_probe.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install submitter
        run: |
          set -Eeuo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -e .

      - name: Submit isolated segment 1 probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          source=Path("hidden_beyond/segment1_probe_worker.py").read_text(encoding="utf-8")
          worker=KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
              submission_retry_attempts=5,
              submission_retry_delay_seconds=30,
          )
          sub=worker.submit_script(
              slug="hidden-beyond-segment1-probe-callback",
              title="Hidden Beyond Segment 1 Probe Callback",
              source=source,
              enable_internet=True,
              enable_gpu=True,
              is_private=True,
          )
          print("PROBE_SUBMITTED",sub.ref,sub.version_number,flush=True)
          print("RESULT_WILL_ARRIVE_VIA_SUPABASE_CALLBACK",flush=True)
          PY
