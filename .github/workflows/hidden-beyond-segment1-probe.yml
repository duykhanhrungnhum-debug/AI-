name: Hidden Beyond Segment1 Probe

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/segment1_probe.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install submitter
        run: |
          set -Eeuo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -e .

      - name: Submit and wait for isolated segment 1 probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          source=Path("hidden_beyond/segment1_probe_worker.py").read_text(encoding="utf-8")
          worker=KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=120,
              submission_retry_attempts=3,
              submission_retry_delay_seconds=20,
          )
          slug="hidden-beyond-segment1-probe"
          sub=worker.submit_script(
              slug=slug,
              title="Hidden Beyond Segment 1 Probe",
              source=source,
              enable_internet=True,
              enable_gpu=True,
              is_private=True,
          )
          print("PROBE_SUBMITTED",sub.ref,sub.version_number,flush=True)

          for i in range(90):
              st=worker.status(slug)
              print("PROBE_STATUS",i+1,st.status,st.failure_message,flush=True)
              if st.terminal:
                  break
              time.sleep(20)
          else:
              raise RuntimeError("segment1 probe timed out")

          try:
              logs=worker.logs(slug)
              print(logs[-12000:],flush=True)
          except Exception as exc:
              print("PROBE_LOG_READ_ERROR",repr(exc),flush=True)

          if not st.successful:
              raise RuntimeError("segment1 probe Kaggle failed: "+st.failure_message)

          data=worker.download_output_file(slug,"segment1-probe-result.json")
          Path("segment1-probe-result.json").write_bytes(data)
          result=json.loads(data.decode("utf-8"))
          print("SEGMENT1_FINAL_RESULT",json.dumps(result,ensure_ascii=False),flush=True)
          if not result.get("ok"):
              raise RuntimeError("segment1 probe still fails: "+json.dumps(result,ensure_ascii=False))
          PY

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-segment1-probe
          path: segment1-probe-result.json
          if-no-files-found: warn
          retention-days: 7
