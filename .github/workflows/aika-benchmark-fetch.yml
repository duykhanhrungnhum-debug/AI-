name: AIKA Benchmark Fetch
on:
  push:
    branches: [benchmark-fetch-temp]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Poll benchmark and download images
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://aika-chat-canary-v3-production.up.railway.app/_aika_benchmark/7d4f3a9c2e8b41f6a1c5d9e372b640af'
          mkdir -p out
          for i in $(seq 1 70); do
            curl -fsS "$BASE/status" -o out/status.json || true
            if [ -s out/status.json ]; then
              STATUS=$(python - <<'PY'
import json
try:
    print(json.load(open('out/status.json')).get('status',''))
except Exception:
    print('')
PY
)
              echo "poll=$i status=$STATUS"
              cat out/status.json
              echo
              if [ "$STATUS" = 'success' ]; then
                curl -fsS "$BASE/1.png" -o out/1.png
                curl -fsS "$BASE/2.png" -o out/2.png
                exit 0
              fi
              if [ "$STATUS" = 'failure' ]; then
                exit 1
              fi
            fi
            sleep 10
          done
          echo 'benchmark fetch timed out' >&2
          exit 1

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aika-crab-frog-benchmark
          path: out/
          if-no-files-found: warn
