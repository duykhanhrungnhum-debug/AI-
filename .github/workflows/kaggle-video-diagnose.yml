name: Diagnose Latest AIKA Video Kernel

on:
  push:
    branches: [main]
    paths:
      - ".github/kaggle-video-diagnose.trigger"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Inspect newest isolated AIKA video kernels without submitting GPU
        shell: bash
        run: |
          mkdir -p video-diag
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          token = os.environ["KAGGLE_API_TOKEN"].strip()
          username = os.environ["KAGGLE_USERNAME"].strip()
          worker = KaggleGpuWorker(api_token=token, username=username, timeout=30)
          result = {"username": username, "candidates": []}

          query = urlencode({"user": username, "pageSize": 100, "sortBy": "dateRun"})
          req = Request(
              "https://www.kaggle.com/api/v1/kernels/list?" + query,
              headers={"Authorization": f"Bearer {token}", "Accept": "application/json", "User-Agent": "AIKA-Diag/1"},
          )
          try:
              with urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
              listed = json.loads(raw)
              result["list_type"] = type(listed).__name__
              result["list_preview"] = listed if isinstance(listed, dict) else listed[:20]
          except Exception as exc:
              result["list_error"] = f"{type(exc).__name__}: {exc}"
              listed = []

          items = []
          if isinstance(listed, list):
              items = listed
          elif isinstance(listed, dict):
              for key in ("kernels", "items", "results"):
                  value = listed.get(key)
                  if isinstance(value, list):
                      items = value
                      break

          slugs = []
          for item in items:
              if not isinstance(item, dict):
                  continue
              ref = str(item.get("ref") or item.get("id") or item.get("slug") or item.get("kernelRef") or "")
              title = str(item.get("title") or item.get("name") or "")
              slug = ref.split("/", 1)[-1] if "/" in ref else ref
              if not slug:
                  slug = str(item.get("slug") or "")
              if slug.startswith("ai-agent-video-tool-") or slug.startswith("ai-agent-video-smoke-") or title.startswith("AIKA ai-agent-video-tool-"):
                  slugs.append(slug)
              if len(slugs) >= 8:
                  break

          result["candidate_slugs"] = slugs
          for slug in slugs:
              entry = {"slug": slug}
              try:
                  entry["status"] = worker.status(slug).__dict__
              except Exception as exc:
                  entry["status_error"] = f"{type(exc).__name__}: {exc}"
              try:
                  entry["output_metadata"] = worker.output_metadata(slug)
              except Exception as exc:
                  entry["output_error"] = f"{type(exc).__name__}: {exc}"
              try:
                  report = worker.download_output_file(slug, "video_tool_report.json").decode("utf-8", errors="replace")
                  entry["report"] = json.loads(report)
              except Exception as exc:
                  entry["report_error"] = f"{type(exc).__name__}: {exc}"
              try:
                  entry["logs_tail"] = worker.logs(slug)[-16000:]
              except Exception as exc:
                  entry["logs_error"] = f"{type(exc).__name__}: {exc}"
              result["candidates"].append(entry)

          text = json.dumps(result, ensure_ascii=False, indent=2) + "\n"
          Path("video-diag/diag.json").write_text(text, encoding="utf-8")
          print("AIKA_VIDEO_DIAGNOSE")
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aika-video-diagnosis
          path: video-diag/diag.json
          if-no-files-found: error
          retention-days: 3
