name: Diagnose Latest AIKA Video Kernel

on:
  push:
    branches: [main]
    paths:
      - ".github/kaggle-video-diagnose.trigger"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Recover exact AIKA video run without submitting GPU
        shell: bash
        run: |
          mkdir -p video-diag
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ai_agent.core.kaggle_worker import KaggleGpuWorker

          slug = "aika-ai-agent-video-smoke-8ad4ac84fe-a54c135da3"
          worker = KaggleGpuWorker(
              api_token=os.environ["KAGGLE_API_TOKEN"],
              username=os.environ["KAGGLE_USERNAME"],
              timeout=45,
          )
          result = {"slug": slug}
          try:
              result["status"] = worker.status(slug).__dict__
          except Exception as exc:
              result["status_error"] = f"{type(exc).__name__}: {exc}"
          try:
              result["output_metadata"] = worker.output_metadata(slug)
          except Exception as exc:
              result["output_error"] = f"{type(exc).__name__}: {exc}"
          try:
              report_bytes = worker.download_output_file(slug, "video_tool_report.json")
              result["report"] = json.loads(report_bytes.decode("utf-8", errors="replace"))
              Path("video-diag/video_tool_report.json").write_bytes(report_bytes)
          except Exception as exc:
              result["report_error"] = f"{type(exc).__name__}: {exc}"
          try:
              video = worker.download_output_file(slug, "video_tool.mp4")
              Path("video-diag/video_tool.mp4").write_bytes(video)
              result["video_bytes"] = len(video)
          except Exception as exc:
              result["video_error"] = f"{type(exc).__name__}: {exc}"
          try:
              result["logs_tail"] = worker.logs(slug)[-16000:]
          except Exception as exc:
              result["logs_error"] = f"{type(exc).__name__}: {exc}"
          text = json.dumps(result, ensure_ascii=False, indent=2) + "\n"
          Path("video-diag/diag.json").write_text(text, encoding="utf-8")
          print("AIKA_VIDEO_RECOVERY")
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aika-video-diagnosis
          path: video-diag/
          if-no-files-found: error
          retention-days: 3
