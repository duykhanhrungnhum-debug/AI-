name: Trading Background Training

on:
  push:
    branches: [main]
    paths:
      - 'src/ai_agent/core/trading_skill.py'
      - 'src/ai_agent/core/trading_learning_memory.py'
      - 'src/ai_agent/core/news_rss.py'
      - 'scripts/trading_background_train.py'
      - 'tests/test_trading_skill.py'
      - 'tests/test_trading_learning_memory.py'
      - 'tests/test_news_rss.py'
      - '.github/workflows/trading-background-training.yml'
      - 'docs/TRADING_SKILL.md'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trading-background-training
  cancel-in-progress: false

jobs:
  oil-research-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: python -m pip install -e .

      - name: Restore persistent trading learning state
        uses: actions/cache/restore@v4
        with:
          path: .agent_state/trading
          key: trading-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            trading-state-

      - name: Run oil research learning cycle with immediate retry
        id: train
        shell: bash
        run: |
          set +e
          rc=1
          for attempt in 1 2 3; do
            echo "Trading learning attempt $attempt/3"
            python scripts/trading_background_train.py \
              --state .agent_state/trading/state.json \
              --output trading_training_episode.json \
              --news-per-query 3
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Trading learning VERIFIED on attempt $attempt"
              exit 0
            fi
            echo "::warning::Trading learning attempt $attempt failed with exit code $rc"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          echo "::error::Trading learning failed after 3 attempts"
          exit "$rc"

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-training-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trading_training_episode.json
            .agent_state/trading/state.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save persistent trading learning state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .agent_state/trading
          key: trading-state-${{ github.run_id }}-${{ github.run_attempt }}
