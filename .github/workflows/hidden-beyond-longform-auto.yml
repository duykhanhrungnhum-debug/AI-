name: Hidden Beyond Longform Auto

on:
  push:
    branches: [main]
    paths:
      - "hidden_beyond/longform/auto.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hidden-beyond-longform-auto
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: duykhanhta
      LONGFORM_API: https://rlqqcuuphjmwksanbfml.supabase.co/functions/v1/longform-upload-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coordinator
        run: |
          set -Eeuo pipefail
          test -n "$KAGGLE_API_TOKEN"
          python -m pip install -e .
          jq . hidden_beyond/longform/auto.json

      - name: Create direct processing job
        id: start
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "start" > orchestrator-stage.txt
          OIDC="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-longform-upload"             | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          SERIES_ID="$(jq -r '.series_id' hidden_beyond/longform/auto.json)"
          SOURCE_VIDEO_ID="$(jq -r '.source_video_id' hidden_beyond/longform/auto.json)"
          FORCE_REPROCESS="$(jq -r '.force_reprocess // false' hidden_beyond/longform/auto.json)"
          VERSION_LABEL="$(jq -r '.version_label // ""' hidden_beyond/longform/auto.json)"
          jq -n             --argjson series_id "$SERIES_ID"             --arg source_video_id "$SOURCE_VIDEO_ID"             --argjson force_reprocess "$FORCE_REPROCESS"             --arg version_label "$VERSION_LABEL"             '{series_id:$series_id,source_video_id:$source_video_id,force_reprocess:$force_reprocess,version_label:$version_label}'             > start-body.json

          HTTP="$(curl -sS -o start.json -w "%{http_code}" -X POST "$LONGFORM_API/start"             -H "Authorization: Bearer $OIDC"             -H "content-type: application/json"             --data-binary @start-body.json)"
          cat start.json
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error title=Hidden Beyond start failed::http=$HTTP $(cat start.json)"
            exit 1
          fi

          STAGE="$(jq -r '.stage' start.json)"
          if [ "$STAGE" = "already_uploaded" ]; then
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            echo "ALREADY_UPLOADED"
            exit 0
          fi
          test "$STAGE" = "job_created"
          jq -r '.job_id' start.json > job-id.txt
          echo "run_worker=true" >> "$GITHUB_OUTPUT"
          echo "DIRECT_JOB_CREATED id=$(cat job-id.txt)"

      - name: Submit one end-to-end worker
        if: steps.start.outputs.run_worker == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "submit_worker" > orchestrator-stage.txt
          python scripts/submit_hidden_beyond_audio_worker.py --start start.json
          test -s gpu-submission.json
          cat gpu-submission.json

      - name: Follow direct worker
        if: steps.start.outputs.run_worker == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "worker" > orchestrator-stage.txt
          JOB_ID="$(cat job-id.txt)"

          for i in $(seq 1 140); do
            OIDC="$(curl -fsSL               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-longform-upload"               | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            jq -n --arg job_id "$JOB_ID" '{job_id:$job_id}' > status-body.json
            curl --fail-with-body -sS -X POST "$LONGFORM_API/status"               -H "Authorization: Bearer $OIDC"               -H "content-type: application/json"               --data-binary @status-body.json > status.json

            STATE="$(jq -r '.job.state' status.json)"
            STAGE="$(jq -r '.job.stage' status.json)"
            MSG="$(jq -r '.job.message // ""' status.json)"
            AGE="$(jq -r '.job.heartbeat_age_seconds // 0' status.json)"
            echo "PROGRESS poll=$i state=$STATE stage=$STAGE heartbeat_age=${AGE}s message=$MSG"

            if [ "$STATE" = "completed" ]; then
              jq -r '.job.youtube_video_id' status.json > youtube-video-id.txt
              test -s youtube-video-id.txt
              echo "DIRECT_WORKER_COMPLETED id=$(cat youtube-video-id.txt)"
              exit 0
            fi
            if [ "$STATE" = "failed" ] || [ "$STATE" = "stalled" ]; then
              echo "::error title=Hidden Beyond worker stopped::$STATE / $STAGE / $MSG"
              exit 1
            fi
            sleep 30
          done

          echo "::error title=Hidden Beyond timeout::Direct worker did not finish within 70 minutes."
          exit 1

      - name: Verify YouTube accepted upload
        if: steps.start.outputs.run_worker == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "youtube_verify" > orchestrator-stage.txt
          VIDEO_ID="$(cat youtube-video-id.txt)"
          OIDC="$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hidden-beyond-longform-upload"             | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          jq -n --arg youtube_video_id "$VIDEO_ID" '{youtube_video_id:$youtube_video_id}' > video-status-body.json
          curl --fail-with-body -sS -X POST "$LONGFORM_API/video-status"             -H "Authorization: Bearer $OIDC"             -H "content-type: application/json"             --data-binary @video-status-body.json > video-status.json
          cat video-status.json

          test "$(jq -r '.exists' video-status.json)" = "true"
          UPLOAD="$(jq -r '.upload_status // ""' video-status.json)"
          if [ "$UPLOAD" = "rejected" ] || [ "$UPLOAD" = "failed" ] || [ "$UPLOAD" = "deleted" ]; then
            echo "::error title=YouTube rejected upload::$(cat video-status.json)"
            exit 1
          fi
          echo "YOUTUBE_ACCEPTED https://www.youtube.com/watch?v=$VIDEO_ID"

      - name: Report failure
        if: failure() || cancelled()
        shell: bash
        run: |
          STAGE="$(cat orchestrator-stage.txt 2>/dev/null || echo unknown)"
          echo "::error title=Hidden Beyond stopped::stage=$STAGE"

      - name: Preserve small evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-beyond-direct-worker-evidence
          path: |
            start.json
            gpu-submission.json
            status.json
            video-status.json
            orchestrator-stage.txt
          if-no-files-found: warn
          retention-days: 7
